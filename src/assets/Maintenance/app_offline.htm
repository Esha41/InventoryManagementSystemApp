<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EMDAD - Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --color-brand: #c8a87f;
      --color-brand-dark: #b89668;
      --color-text: #23272E;
      --color-text-muted: #8B909A;
      --color-background: #FFFFFF;
      --color-background-muted: #F9FAFB;
      --color-background-hover: #F3F4F8;
      --color-border: #E5E7EB;
      --color-amber-bg: rgba(245, 158, 11, 0.1);
      --color-amber: #d97706;
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: #E5E7EB;
        --color-text-muted: #9CA3AF;
        --color-background: #1A1D24;
        --color-background-muted: #13161B;
        --color-background-hover: #252932;
        --color-border: #4B5563;
        --color-amber-bg: rgba(251, 191, 36, 0.15);
        --color-amber: #FBBF24;
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.4);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', 'Cairo', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      background: linear-gradient(to bottom right, var(--color-background-muted), var(--color-background-hover));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
    .card {
      width: min(75vw, 600px);
      min-height: min(65vh, 450px);
      background: var(--color-background);
      border-radius: 1rem;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--color-border);
      padding: 2.5rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo-title {
      font-size: 2rem;
      font-weight: 700;
      color: #6A2C30;
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }
    .logo-tagline {
      font-size: 0.75rem;
      color: #333333;
      line-height: 1.4;
      margin-bottom: 0.2rem;
    }
    .logo-tagline-ar {
      font-size: 0.75rem;
      color: #333333;
      font-family: 'Cairo', 'Tajawal', 'Noto Sans Arabic', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .logo-title { color: #c85a60; }
      .logo-tagline,
      .logo-tagline-ar { color: var(--color-text-muted); }
    }
    .icon-wrap {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      border-radius: 9999px;
      background: var(--color-amber-bg);
      border: 1px solid var(--color-amber);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap svg {
      width: 1.75rem;
      height: 1.75rem;
      color: var(--color-amber);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.9375rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      max-width: 28rem;
      margin: 0 auto 0.5rem;
    }
    p:last-of-type {
      margin-bottom: 0;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-title">EMDAD</div>      
    </div>
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="8" rx="1"/>
        <path d="M17 14v7"/>
        <path d="M7 14v7"/>
        <path d="M17 3v3"/>
        <path d="M7 3v3"/>
        <path d="M10 14 2.3 6.3"/>
        <path d="m14 6 7.7 7.7"/>
        <path d="m8 6 8 8"/>
      </svg>
    </div>
    <h1>We'll Be Back Soon!</h1>
    <p>Our website is currently under maintenance.</p>
    <p>We're working hard to improve your experience.</p>
    <p>Thank you for your patience </p>
  </div>
</body>
</html>
