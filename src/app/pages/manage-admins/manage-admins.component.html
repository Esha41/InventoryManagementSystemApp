<div class="page-wrapper">
  <div class="page-container space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-[var(--color-text)]">{{ 'manageAdmins.title' | translate }}</h1>
        <p class="text-sm text-[var(--color-text-muted)] mt-1">{{ 'manageAdmins.subtitle' | translate }}</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="border-b border-[var(--color-border)]">
      <nav class="flex space-x-8">
        <button (click)="setActiveTab('users')" [class.border-b-2]="activeTab === 'users'"
          [class.border-[var(--color-brand)]]="activeTab === 'users'"
          [class.text-[var(--color-brand)]]="activeTab === 'users'"
          [class.text-[var(--color-text-muted)]]="activeTab !== 'users'"
          class="px-1 py-4 text-sm font-medium transition-colors">
          <div class="flex items-center gap-2">
            <lucide-angular [img]="UserIcon" class="h-4 w-4"></lucide-angular>
            {{ 'manageAdmins.usersTab' | translate }}
          </div>
        </button>
        <button (click)="setActiveTab('lookups')" [class.border-b-2]="activeTab === 'lookups'"
          [class.border-[var(--color-brand)]]="activeTab === 'lookups'"
          [class.text-[var(--color-brand)]]="activeTab === 'lookups'"
          [class.text-[var(--color-text-muted)]]="activeTab !== 'lookups'"
          class="px-1 py-4 text-sm font-medium transition-colors">
          <div class="flex items-center gap-2">
            <lucide-angular [img]="Database" class="h-4 w-4"></lucide-angular>
            {{ 'lookupManagement.title' | translate }}
          </div>
        </button>
      </nav>
    </div>

    <!-- Users Tab Content -->
    <app-user-management *ngIf="activeTab === 'users'"></app-user-management>

    <!-- Lookup Tables Tab Content -->
    <app-lookup-management *ngIf="activeTab === 'lookups'"></app-lookup-management>
  </div>
</div>
