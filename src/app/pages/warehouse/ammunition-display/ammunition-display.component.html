<div class="min-h-screen bg-[#F5F5F5] py-8 px-6">
  <div class="max-w-4xl mx-auto">
    <!-- Page Title -->
    <h1 class="text-3xl font-bold text-[var(--color-text)] mb-8">
      {{ 'inventoryCategory.title' | translate }}
    </h1>

    <!-- Category Cards -->
    <div class="space-y-6">
      <div 
        *ngFor="let category of categories"
        class="bg-[#F0F0F0] rounded-lg shadow-sm overflow-hidden flex flex-row items-center p-6">
        
        <!-- Left Section: Image Container -->
        <div class="flex-shrink-0 mr-8">
          <div class="w-40 h-40 bg-white rounded-lg flex items-center justify-center p-4">
            <img 
              [src]="category.image" 
              [alt]="category.name"
              class="max-w-full max-h-full object-contain"
              loading="lazy"
            />
          </div>
        </div>

        <!-- Right Section: Content Area -->
        <div class="flex-1 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-[var(--color-text)]">
            {{ category.nameKey | translate }}
          </h2>
          <button 
            (click)="onView(category)"
            class="bg-[var(--color-brand)] hover:bg-[var(--color-brand-dark)] text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200">
            {{ 'common.view' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
