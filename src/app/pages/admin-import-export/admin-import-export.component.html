<div class="page-wrapper">
  <!-- Header -->
  <div class="bg-gray-50 border-b border-gray-200">
    <div class="page-container py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">
            {{ 'adminImportExport.title' | translate }}
          </h1>
          <p class="text-sm text-gray-600">
            {{ 'adminImportExport.subtitle' | translate }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container">
    <!-- Section Tabs -->
    <app-card [shadow]="true" class="mb-6 overflow-hidden">
      <div class="bg-gradient-to-r from-[var(--color-background)] to-[var(--color-background-hover)]">
        <nav class="flex gap-1 p-2" aria-label="Sections">
          <button (click)="switchSection('assets')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection === 'assets',
            'bg-white text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection !== 'assets'
          }" class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
            <span>{{ 'adminImportExport.sections.assets' | translate }}</span>
          </button>
          <button (click)="switchSection('inventory-summary')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection === 'inventory-summary',
            'bg-white text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection !== 'inventory-summary'
          }" class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
            <span>{{ 'adminImportExport.sections.inventorySummary' | translate }}</span>
          </button>
          <button (click)="switchSection('warehouse-inventory')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection === 'warehouse-inventory',
            'bg-white text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection !== 'warehouse-inventory'
          }" class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
            <span>{{ 'adminImportExport.sections.warehouseInventory' | translate }}</span>
          </button>
        </nav>
      </div>
    </app-card>

    <!-- Assets Section -->
    <app-assets-import-export 
      *ngIf="activeSection === 'assets'"
      [activeTab]="activeAssetTab">
    </app-assets-import-export>

    <!-- Inventory Summary Section -->
    <app-inventory-summary 
      *ngIf="activeSection === 'inventory-summary'">
    </app-inventory-summary>

    <!-- Warehouse Inventory Section -->
    <app-warehouse-inventory 
      *ngIf="activeSection === 'warehouse-inventory'">
    </app-warehouse-inventory>
  </div>
</div>
