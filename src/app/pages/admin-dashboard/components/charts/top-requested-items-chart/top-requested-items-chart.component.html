<div class="chart-container">
    <div class="chart-header">
        <div class="header-info">
            <lucide-icon [img]="TrendingUp" class="header-icon"></lucide-icon>
            <h3 class="chart-title">{{ 'adminDashboard.charts.topRequestedItems' | translate }}</h3>
        </div>
        <button class="action-btn" (click)="loadData()" [class.spinning]="loading"
            [title]="'adminDashboard.refresh' | translate">
            <lucide-icon [img]="RefreshCw" class="icon-sm"></lucide-icon>
        </button>
    </div>

    <div class="chart-body" [class.loading]="loading">
        <div *ngIf="loading" class="chart-loader">
            <div class="spinner"></div>
            <span>{{ 'adminDashboard.charts.analyzingItems' | translate }}</span>
        </div>

        <div *ngIf="error" class="chart-error">
            <lucide-icon [img]="AlertCircle" class="error-icon"></lucide-icon>
            <span>{{ 'adminDashboard.charts.failedToLoad' | translate }}</span>
            <button (click)="loadData()" class="retry-btn">{{ 'adminDashboard.charts.retry' | translate }}</button>
        </div>

        <div echarts [options]="chartOptions" class="echarts-graph" *ngIf="!loading && !error"></div>
    </div>
</div>
