<div class="admin-dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="header-content">
            <div class="title-section">
                <h1 class="dashboard-title">{{ 'adminDashboard.title' | translate }}</h1>
            </div>

            <div class="header-actions">
                <button class="refresh-button" (click)="onRefresh()" [disabled]="isRefreshing"
                    [attr.aria-label]="'adminDashboard.refresh' | translate">
                    <lucide-icon [img]="RefreshCw" [class.spinning]="isRefreshing" class="refresh-icon">
                    </lucide-icon>
                    <span>{{ 'adminDashboard.refresh' | translate }}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">{{ 'adminDashboard.loading' | translate }}</p>
    </div>

    <!-- Dashboard Content -->
    <div *ngIf="!isLoading" class="dashboard-content">
        <!-- User Activity Section -->
        <div class="space-y-6">
            <div class="kpi-grid">
                <!-- User Activity Card (Made full width or just part of grid) -->
                <app-user-activity-card *ngIf="userActivityMetrics" [metrics]="userActivityMetrics" class="kpi-card">
                </app-user-activity-card>
            </div>
        </div>

        <!-- Delegations Section (Commented out for this version)
        <div class="delegations-section">
            <div class="section-header">
                <h2 class="section-title">{{ 'DELEGATION.ADMIN_TITLE' | translate }}</h2>
            </div>
            <div class="delegations-view">
                <app-admin-delegations></app-admin-delegations>
            </div>
        </div>
        -->
    </div>
</div>
