<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-[var(--color-text)]">{{ 'addAsset.title' | translate }}</h1>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center py-12">
    <div class="text-[var(--color-text)]">Loading form data...</div>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="mb-4 p-4 bg-green-100 text-green-700 rounded-lg">
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg">
    {{ errorMessage }}
  </div>

  <!-- Centered Form Container -->
  <div class="flex-1 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-custom-md p-6 w-full max-w-2xl">
      <h2 class="text-xl font-bold text-[var(--color-text)] mb-6">{{ 'addAsset.formTitle' | translate }}</h2>
    
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Image Upload Section -->
      <div class="flex items-center justify-center gap-4 mb-6">
        <div class="w-[81px] h-[81px] border border-dashed border-[var(--color-brand)]/50 rounded-md bg-white overflow-hidden cursor-pointer relative"
             (click)="triggerFileInput()"
             (dragover)="onDragOver($event)"
             (drop)="onDrop($event)">
          <img *ngIf="previewUrl; else placeholderIcon" 
               [src]="previewUrl" 
               alt="Preview" 
               class="w-full h-full object-cover rounded-md" />
          <ng-template #placeholderIcon>
            <div class="w-full h-full flex items-center justify-center">
              <div class="w-12 h-12 bg-[#F3F4F6] rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-[#6B7280]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
              </div>
            </div>
          </ng-template>
        </div>
        <div class="text-left">
          <p class="text-sm text-[#6B7280]">{{ 'addAsset.dragImageHere' | translate }}</p>
          <p class="text-sm text-[#6B7280]">{{ 'addAsset.or' | translate }} <span class="text-[var(--color-brand)] cursor-pointer" (click)="triggerFileInput()">{{ 'addAsset.browseImage' | translate }}</span></p>
        </div>
        <input
          type="file"
          #fileInput
          (change)="onFileSelect($event)"
          accept="image/*"
          class="hidden"
        />
      </div>

      <!-- Form Fields -->
      <div class="space-y-4">
        <!-- Product Name -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.productName' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="assetForm.productName"
            name="productName"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            [placeholder]="'addAsset.enterProductName' | translate"
          />
        </div>

        <!-- Product ID -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.productId' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="assetForm.productId"
            name="productId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            [placeholder]="'addAsset.enterProductId' | translate"
          />
        </div>

        <!-- Nature -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.nature' | translate }}</label>
          <select
            [(ngModel)]="assetForm.natureId"
            name="natureId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
          >
            <option value="">{{ 'addAsset.selectNature' | translate }}</option>
            <option *ngFor="let nature of natureOptions" [value]="nature.id">{{ nature.nameEn }}</option>
          </select>
        </div>

        <!-- Supplier -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.supplier' | translate }}</label>
          <select
            [(ngModel)]="assetForm.supplierId"
            name="supplierId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
          >
            <option value="">{{ 'addAsset.selectSupplier' | translate }}</option>
            <option *ngFor="let supplier of suppliers" [value]="supplier.id">{{ supplier.nameEn }}</option>
          </select>
        </div>

        <!-- HCC (Required) -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.hcc' | translate }} *</label>
          <select
            [(ngModel)]="assetForm.hccId"
            name="hccId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            required
          >
            <option value="">{{ 'addAsset.selectHcc' | translate }}</option>
            <option *ngFor="let hcc of hccs" [value]="hcc.id">{{ hcc.nameEn }}</option>
          </select>
        </div>

        <!-- Country -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.country' | translate }}</label>
          <select
            [(ngModel)]="assetForm.countryId"
            name="countryId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
          >
            <option value="">{{ 'addAsset.selectCountry' | translate }}</option>
            <option *ngFor="let country of countries" [value]="country.id">{{ country.nameEn }}</option>
          </select>
        </div>

        <!-- Manufacturer -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.manufacturer' | translate }}</label>
          <select
            [(ngModel)]="assetForm.manufacturerId"
            name="manufacturerId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
          >
            <option value="">{{ 'addAsset.selectManufacturer' | translate }}</option>
            <option *ngFor="let manufacturer of manufacturers" [value]="manufacturer.id">{{ manufacturer.nameEn }}</option>
          </select>
        </div>

        <!-- Quantity -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.quantity' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="assetForm.quantity"
            name="quantity"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            [placeholder]="'addAsset.enterQuantity' | translate"
          />
        </div>

        <!-- LOT -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.lot' | translate }}</label>
          <input
            type="text"
            [(ngModel)]="assetForm.lot"
            name="lot"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            [placeholder]="'addAsset.enterLotNumber' | translate"
          />
        </div>

        <!-- Expiry Date -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.expiryDate' | translate }}</label>
          <input
            type="date"
            [(ngModel)]="assetForm.expiryDate"
            name="expiryDate"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            [placeholder]="'addAsset.selectExpiryDate' | translate"
          />
        </div>

        <!-- Warehouse -->
        <div class="flex items-center gap-6">
          <label class="text-sm font-medium text-[#6B7280] w-28 shrink-0">{{ 'addAsset.warehouse' | translate }} *</label>
          <select
            [(ngModel)]="assetForm.warehouseId"
            name="warehouseId"
            class="flex-1 px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
            required
          >
            <option value="">{{ 'addAsset.selectWarehouse' | translate }}</option>
            <option *ngFor="let warehouse of warehouses" [value]="warehouse.id">{{ warehouse.nameEn }} ({{ warehouse.location }})</option>
          </select>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end gap-3 pt-6">
        <button
          type="button"
          (click)="onCancel()"
          class="px-6 py-2.5 border border-[var(--color-border)] text-[var(--color-text)] rounded-lg hover:bg-[var(--color-background-hover)] transition-colors"
        >
          {{ 'addAsset.discard' | translate }}
        </button>
        <button
          type="submit"
          [disabled]="submitting || loading"
          class="px-6 py-2.5 bg-[var(--color-brand)] text-white rounded-lg hover:bg-[var(--color-brand-dark)] transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ submitting ? ('addAsset.saving' | translate) : ('addAsset.addAsset' | translate) }}
        </button>
      </div>
    </form>
    </div>
  </div>
</div>
