<div class="space-y-6">
  <!-- Header -->
  <div>
    <h1 class="text-3xl font-bold text-[var(--color-text)]">{{ 'dashboard.title' | translate }}</h1>
    <p class="text-[var(--color-text-muted)] mt-1">{{ 'dashboard.subtitle' | translate }}</p>
  </div>

  <!-- Status Cards Grid - Show cards based on user permissions and roles -->
  <div *ngIf="visibleCards.length > 0" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <app-status-card
      *ngFor="let card of visibleCards"
      [title]="card.title | translate"
      [status]="card.status"
      [orders]="card.orders"
    ></app-status-card>
  </div>

  <!-- No Cards Message -->
  <div *ngIf="visibleCards.length === 0" class="text-center py-12">
    <p class="text-[var(--color-text-muted)] text-lg">
      {{ 'dashboard.noCards' | translate }}
    </p>
    <p class="text-[var(--color-text-muted)] text-sm mt-2">
      {{ 'dashboard.noCardsDescription' | translate }}
    </p>
  </div>
</div>
