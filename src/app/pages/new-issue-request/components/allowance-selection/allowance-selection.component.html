<div class="bg-[var(--color-background)] rounded-lg p-8 shadow-sm">
  <h2 class="text-2xl font-bold text-[var(--color-text)] mb-6">{{ 'newIssueRequest.selectOrderSource' | translate }}
  </h2>

  <div class="mb-8">
    <p class="text-sm text-[var(--color-text-muted)] mb-6">{{ 'newIssueRequest.selectOrderSourceDescription' |
      translate }}</p>

    <div class="flex flex-col space-y-4">
      <label class="flex items-start p-4 border-2 rounded-lg cursor-pointer transition-all"
        [ngClass]="fromReserve === 'Yes' ? 'border-[var(--color-brand)] bg-[var(--color-brand)]/5' : 'border-[var(--color-border)] hover:border-[var(--color-brand)]/50'">
        <input type="radio" name="fromReserve" value="Yes" [ngModel]="fromReserve"
          (ngModelChange)="onFromReserveChange($event)"
          class="w-5 h-5 mt-0.5 text-[var(--color-brand)] border-[var(--color-border)] focus:ring-[var(--color-brand)] focus:ring-2">
        <div class="ms-4">
          <span class="block text-base font-semibold text-[var(--color-text)]">{{ 'newIssueRequest.fromAllowance' |
            translate }}</span>
          <span class="block text-sm text-[var(--color-text-muted)] mt-1">{{
            'newIssueRequest.fromAllowanceDescription' | translate }}</span>
        </div>
      </label>

      <label class="flex items-start p-4 border-2 rounded-lg cursor-pointer transition-all"
        [ngClass]="fromReserve === 'No' ? 'border-[var(--color-brand)] bg-[var(--color-brand)]/5' : 'border-[var(--color-border)] hover:border-[var(--color-brand)]/50'">
        <input type="radio" name="fromReserve" value="No" [ngModel]="fromReserve"
          (ngModelChange)="onFromReserveChange($event)"
          class="w-5 h-5 mt-0.5 text-[var(--color-brand)] border-[var(--color-border)] focus:ring-[var(--color-brand)] focus:ring-2">
        <div class="ms-4">
          <span class="block text-base font-semibold text-[var(--color-text)]">{{
            'newIssueRequest.fromAllAmmunition' | translate }}</span>
          <span class="block text-sm text-[var(--color-text-muted)] mt-1">{{
            'newIssueRequest.fromAllAmmunitionDescription' | translate }}</span>
        </div>
      </label>
    </div>
  </div>

  <div class="flex justify-end">
    <app-button variant="primary" (clicked)="onNext()">
      {{ 'newIssueRequest.next' | translate }}
    </app-button>
  </div>
</div>
