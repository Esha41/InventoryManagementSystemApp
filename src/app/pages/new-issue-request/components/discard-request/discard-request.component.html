<div class="flex justify-center">
  <div class="w-full max-w-4xl">
    <div class="space-y-6">
      <div>
        <h1 class="text-3xl font-bold text-[var(--color-text)]">{{ 'discardRequest.title' | translate }}</h1>
      </div>

      <div class="bg-[#F5F5F5] rounded-xl p-8">
        <form #discardForm="ngForm" (ngSubmit)="onSendRequest(discardForm)">
          <div class="space-y-6 max-w-3xl">
            <div class="flex items-center gap-8">
              <label class="text-sm font-medium text-[#6B7280] w-40 shrink-0">
                {{ 'discardRequest.dateCreated' | translate }}
              </label>
              <input
                type="text"
                [(ngModel)]="dateCreated"
                name="dateCreated"
                readonly
                class="flex-1 px-4 py-2.5 bg-white rounded-lg border-0 text-sm text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
              />
            </div>

            <div class="flex items-start gap-8">
              <label class="text-sm font-medium text-[#6B7280] w-40 shrink-0 pt-2.5">
                {{ 'discardRequest.discardOrderId' | translate }}
              </label>
              <div class="flex-1">
                <input
                  type="text"
                  [(ngModel)]="discardOrderId"
                  name="discardOrderId"
                  [placeholder]="'discardRequest.orderIdPlaceholder' | translate"
                  [class.border-red-500]="hasError('discardOrderId')"
                  class="w-full px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
                />
                <p class="mt-1.5 text-xs" [class.text-red-500]="hasError('discardOrderId')" [class.text-[#9CA3AF]]="!hasError('discardOrderId')">
                  <span *ngIf="hasError('discardOrderId')">{{ getError('discardOrderId') }}</span>
                  <span *ngIf="!hasError('discardOrderId')">{{ 'discardRequest.orderIdHint' | translate }}</span>
                </p>
              </div>
            </div>

            <div class="flex items-start gap-8">
              <label class="text-sm font-medium text-[#6B7280] w-40 shrink-0 pt-2.5">
                {{ 'discardRequest.quantity' | translate }}
              </label>
              <div class="flex-1">
                <input
                  type="text"
                  [(ngModel)]="quantity"
                  name="quantity"
                  [placeholder]="'discardRequest.quantityPlaceholder' | translate"
                  [class.border-red-500]="hasError('quantity')"
                  class="w-full px-4 py-2.5 bg-white rounded-lg border text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
                />
                <p class="mt-1.5 text-xs" [class.text-red-500]="hasError('quantity')" [class.text-[#9CA3AF]]="!hasError('quantity')">
                  <span *ngIf="hasError('quantity')">{{ getError('quantity') }}</span>
                  <span *ngIf="!hasError('quantity')">{{ 'discardRequest.quantityHint' | translate }}</span>
                </p>
              </div>
            </div>

            <div class="flex items-center gap-8">
              <label class="text-sm font-medium text-[#6B7280] w-40 shrink-0">
                {{ 'discardRequest.comments' | translate }}
              </label>
              <input
                type="text"
                [(ngModel)]="comments"
                name="comments"
                [placeholder]="'discardRequest.commentsPlaceholder' | translate"
                class="flex-1 px-4 py-2.5 bg-white rounded-lg border-0 text-sm text-[#23272E] placeholder:text-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
              />
            </div>

            <div class="flex items-center gap-8">
              <div class="flex items-center gap-2 w-40 shrink-0">
                <label class="text-sm font-medium text-[#6B7280]">
                  {{ 'discardRequest.attachment' | translate }}
                </label>
                <button
                  type="button"
                  (click)="triggerFileInput()"
                  class="p-1 hover:bg-[#E5E7EB] rounded transition-colors"
                  [attr.aria-label]="'discardRequest.uploadFile' | translate"
                >
                  <lucide-angular
                    [img]="Upload"
                    class="h-4 w-4 text-[#6B7280]"
                  ></lucide-angular>
                </button>
              </div>
              <input
                type="file"
                id="fileUpload"
                (change)="onFileSelect($event)"
                class="hidden"
                accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
              />
              <div class="flex-1 relative">
                <input
                  type="text"
                  [value]="attachmentName || ('discardRequest.noFileSelected' | translate)"
                  readonly
                  [placeholder]="'discardRequest.noFileSelected' | translate"
                  class="w-full px-4 py-2.5 pr-10 bg-white rounded-lg border-0 text-sm text-[#9CA3AF] cursor-default focus:outline-none"
                />
                <button
                  *ngIf="attachment"
                  type="button"
                  (click)="removeAttachment()"
                  class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 hover:bg-[var(--color-error)]/10 rounded-lg transition-colors duration-200 group"
                  [attr.aria-label]="'discardRequest.removeAttachment' | translate: { default: 'Remove attachment' }"
                >
                  <svg class="h-4 w-4 text-[var(--color-text-muted)] group-hover:text-[var(--color-error)] transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex justify-center pt-6">
              <app-button
                type="submit"
                variant="primary"
                size="md"
                class="px-12"
              >
                {{ 'discardRequest.sendRequest' | translate }}
              </app-button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
