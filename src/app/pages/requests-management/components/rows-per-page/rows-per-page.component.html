<div class="flex items-center gap-2">
  <span class="text-sm text-[var(--color-text)]">{{ 'common.showing' | translate }} {{ displayCount }}</span>
  <app-dropdown
    class="min-w-[80px]"
    [(ngModel)]="rowsPerPage"
    (selectionChange)="onRowsPerPageChange($event)"
    [options]="options">
  </app-dropdown>
  <span class="text-sm text-[var(--color-text)]">{{ 'common.of' | translate }} {{ totalItems }}</span>
</div>
