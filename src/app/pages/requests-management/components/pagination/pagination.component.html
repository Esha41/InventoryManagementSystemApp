<div *ngIf="shouldDisplay" class="pagination-container">
  <!-- Previous Button -->
  <button
    type="button"
    (click)="onPrevious()"
    [disabled]="isPreviousDisabled"
    class="pagination-nav-btn"
    [class.pagination-nav-btn-disabled]="isPreviousDisabled"
    [attr.aria-label]="'common.previous' | translate"
    [attr.aria-disabled]="isPreviousDisabled">
    <lucide-angular [img]="previousIcon" class="h-3.5 w-3.5"></lucide-angular>
  </button>

  <!-- Page Numbers -->
  <ng-container *ngFor="let page of displayPages">
    <button
      *ngIf="page !== 'ellipsis'"
      type="button"
      (click)="onPageClick(page)"
      class="pagination-page-btn"
      [class.pagination-page-active]="page === validatedCurrentPage"
      [class.pagination-page-inactive]="page !== validatedCurrentPage"
      [attr.aria-label]="getPageAriaLabel(page)"
      [attr.aria-current]="page === validatedCurrentPage ? 'page' : null">
      {{ page }}
    </button>
    <span *ngIf="page === 'ellipsis'" class="pagination-ellipsis" aria-hidden="true">
      ...
    </span>
  </ng-container>

  <!-- Next Button -->
  <button
    type="button"
    (click)="onNext()"
    [disabled]="isNextDisabled"
    class="pagination-nav-btn"
    [class.pagination-nav-btn-disabled]="isNextDisabled"
    [attr.aria-label]="'common.next' | translate"
    [attr.aria-disabled]="isNextDisabled">
    <lucide-angular [img]="nextIcon" class="h-3.5 w-3.5"></lucide-angular>
  </button>
</div>
