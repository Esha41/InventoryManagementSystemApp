<div class="flex items-center gap-1">
  <!-- Previous Button -->
  <button
    (click)="onPrevious()"
    [disabled]="currentPage === 1"
    class="px-3 py-2 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
    <lucide-angular [img]="previousIcon" class="h-4 w-4"></lucide-angular>
  </button>

  <!-- Page Numbers -->
  <button
    *ngFor="let page of pages"
    (click)="onPageClick(page)"
    class="pagination-page"
    [ngClass]="page === currentPage ? 'pagination-page-active' : 'pagination-page-inactive'">
    {{ page }}
  </button>

  <!-- Next Button -->
  <button
    (click)="onNext()"
    [disabled]="currentPage === totalPages"
    class="px-3 py-2 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
    <lucide-angular [img]="nextIcon" class="h-4 w-4"></lucide-angular>
  </button>
</div>
