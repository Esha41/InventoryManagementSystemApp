<div class="pagination-container">
  <!-- Previous Button -->
  <button
    (click)="onPrevious()"
    [disabled]="currentPage === 1"
    class="pagination-nav-btn"
    [class.pagination-nav-btn-disabled]="currentPage === 1">
    <lucide-angular [img]="previousIcon" class="h-4 w-4"></lucide-angular>
  </button>

  <!-- Page Numbers -->
  <ng-container *ngFor="let page of displayPages">
    <button
      *ngIf="page !== 'ellipsis'"
      (click)="onPageClick($any(page))"
      class="pagination-page-btn"
      [class.pagination-page-active]="page === currentPage"
      [class.pagination-page-inactive]="page !== currentPage">
      {{ page }}
    </button>
    <span *ngIf="page === 'ellipsis'" class="pagination-ellipsis">
      ...
    </span>
  </ng-container>

  <!-- Next Button -->
  <button
    (click)="onNext()"
    [disabled]="currentPage === totalPages"
    class="pagination-nav-btn"
    [class.pagination-nav-btn-disabled]="currentPage === totalPages">
    <lucide-angular [img]="nextIcon" class="h-4 w-4"></lucide-angular>
  </button>
</div>
