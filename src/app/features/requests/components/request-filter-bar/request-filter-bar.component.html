<!-- Single toolbar: same structure on dashboard and requests management -->
<div
  class="rfb-toolbar flex flex-col xl:flex-row xl:items-end gap-2.5 w-full max-w-full
         bg-transparent">

  <!-- Search -->
  <div *ngIf="showSearchBar" class="app-search-field flex flex-1 min-w-0 items-center group/rfb-search">
    <lucide-angular [img]="Search"
      class="app-search-field__icon z-10 group-focus-within/rfb-search:text-[var(--color-brand)] transition-colors duration-150">
    </lucide-angular>

    <input type="text"
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
      (keyup.enter)="onSearchClick()"
      [placeholder]="searchPlaceholder | translate"
      [ngClass]="useSearchButton ? 'pe-[5.5rem] sm:pe-24' : 'pe-9'"
      class="rfb-search-input app-search-field__input-ps w-full pe-9 py-2.5 rounded-xl text-sm
             bg-[var(--color-background)] text-[var(--color-text)]
             placeholder:text-[var(--color-text-muted)]/80
             border border-transparent
             focus:outline-none focus:border-[var(--color-brand)]
             transition-colors duration-150 min-w-0">

    <div class="absolute end-1.5 flex items-center gap-0.5 flex-shrink-0">
      <button *ngIf="searchQuery" type="button" (click)="clearSearch()"
        class="p-1.5 rounded-lg text-[var(--color-text-muted)] hover:text-[var(--color-error)]
               hover:bg-[var(--color-background-hover)] transition-colors"
        [attr.aria-label]="'common.clearSearch' | translate">
        <lucide-angular [img]="X" class="w-3.5 h-3.5"></lucide-angular>
      </button>
      <button *ngIf="useSearchButton" type="button" (click)="onSearchClick()"
        class="inline-flex items-center justify-center gap-1.5 px-3 py-2
               bg-[var(--color-brand)] text-white text-xs font-semibold rounded-lg
               hover:opacity-95 active:scale-[0.98]
               transition-all flex-shrink-0 whitespace-nowrap shadow-sm min-h-[2.25rem]">
        <lucide-angular [img]="Search" class="w-3.5 h-3.5 xl:hidden"></lucide-angular>
        <span class="hidden xl:inline">{{ 'common.search' | translate }}</span>
      </button>
    </div>
  </div>

  <!-- Divider (wide screens) -->
  <div *ngIf="showSearchBar && (showStatusFilter || showPriorityFilter || showAutoRejectFilter)"
    class="hidden xl:block w-px h-9 bg-[var(--color-border)] flex-shrink-0 xl:self-auto"
    aria-hidden="true">
  </div>

  <!-- Filters + count -->
  <div
    class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-nowrap sm:items-end gap-3 min-w-0 xl:w-auto xl:flex-shrink-0">

    <button *ngIf="showStatusFilter || showPriorityFilter || showAutoRejectFilter"
      type="button"
      (click)="clearAllFilters()"
      [disabled]="!hasActiveFilters"
      class="flex items-center justify-center w-8 h-9 rounded-lg flex-shrink-0 self-end sm:self-auto
             bg-[var(--color-background)] border border-[var(--color-border)] text-[var(--color-text-muted)]
             hover:text-[var(--color-brand)] hover:border-[var(--color-brand)]/40 hover:bg-[var(--color-background-hover)]
             disabled:opacity-40 disabled:pointer-events-none disabled:hover:bg-[var(--color-background)]
             disabled:hover:text-[var(--color-text-muted)] disabled:hover:border-[var(--color-border)]
             transition-colors"
      [attr.title]="'common.filters.clear' | translate"
      [attr.aria-label]="'common.filters.clear' | translate">
      <lucide-angular [img]="Filter" class="w-3.5 h-3.5"></lucide-angular>
    </button>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-end gap-3 flex-1 sm:flex-initial min-w-0">
      <div *ngIf="showStatusFilter" class="rfb-dropdown-field flex flex-col gap-1 min-w-0 sm:min-w-[10rem] flex-1 sm:flex-initial">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text-muted)] ps-0.5">
          {{ 'requestsManagement.filterStatusLabel' | translate }}
        </span>
        <div class="rfb-dropdown-wrap min-w-0 w-full">
          <app-dropdown class="rfb-dropdown"
            [ngModel]="statusFilter"
            (ngModelChange)="onStatusChange($event)"
            [options]="statusFilterOptions"
            [optionLabelFn]="statusFilterLabelFn"
            optionValue="value"
            [placeholderSelectable]="false"
            [showSearch]="false"
            [placeholder]="'requestsManagement.filterStatusPlaceholder' | translate">
          </app-dropdown>
        </div>
      </div>

      <div *ngIf="showPriorityFilter" class="rfb-dropdown-field flex flex-col gap-1 min-w-0 sm:min-w-[10rem] flex-1 sm:flex-initial">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text-muted)] ps-0.5">
          {{ 'requestsManagement.filterPriorityLabel' | translate }}
        </span>
        <div class="rfb-dropdown-wrap min-w-0 w-full">
          <app-dropdown class="rfb-dropdown"
            [ngModel]="priorityFilter"
            (ngModelChange)="onPriorityChange($event)"
            [options]="priorityFilterOptions"
            [optionLabelFn]="priorityFilterLabelFn"
            optionValue="value"
            [placeholderSelectable]="false"
            [showSearch]="false"
            [placeholder]="'requestsManagement.filterPriorityPlaceholder' | translate">
          </app-dropdown>
        </div>
      </div>

      <div *ngIf="showAutoRejectFilter" class="rfb-dropdown-field flex flex-col gap-1 min-w-0 sm:min-w-[10rem] flex-1 sm:flex-initial">
        <span class="text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text-muted)] ps-0.5">
          {{ 'autoRejectCountdown.filter.label' | translate }}
        </span>
        <div class="rfb-dropdown-wrap min-w-0 w-full">
          <app-dropdown class="rfb-dropdown"
            [ngModel]="autoRejectFilter"
            (ngModelChange)="onAutoRejectChange($event)"
            [options]="autoRejectFilterOptions"
            [optionLabelFn]="autoRejectFilterLabelFn"
            optionValue="value"
            [placeholderSelectable]="false"
            [showSearch]="false"
            [placeholder]="'autoRejectCountdown.filter.label' | translate">
          </app-dropdown>
        </div>
      </div>
    </div>

    <div *ngIf="showResultCount"
      class="flex items-center justify-end sm:justify-start sm:ps-1 min-w-0 self-end pb-0.5">
      <span
        class="inline-flex items-center justify-center min-w-[2.5rem] h-9 px-2.5 rounded-xl
               bg-[var(--color-brand)] text-white text-xs font-bold tabular-nums shadow-sm"
        [attr.title]="resultCount + ' ' + ('common.results' | translate)">
        {{ resultCount }}
      </span>
    </div>
  </div>
</div>
