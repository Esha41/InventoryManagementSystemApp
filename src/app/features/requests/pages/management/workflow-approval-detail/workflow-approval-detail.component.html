<div class="min-h-screen bg-[var(--color-background-muted)] p-6">
  <!-- Loading State -->
  <app-loading-state *ngIf="loading" message="workflowApprovalDetail.loadingRequestDetails" size="md" [fullPage]="true">
  </app-loading-state>

  <!-- Error State -->
  <app-error-state *ngIf="!loading && error" [error]="errorMessage" variant="centered" [title]="errorTitle"
    actionText="common.back" (action)="goBack()">
  </app-error-state>

  <!-- Content -->
  <div *ngIf="!loading && !error && requestDetail">
    <!-- Header with Back Button and Status -->
    <div class="mb-6">
      <div class="bg-[var(--color-background)] rounded-xl shadow-custom-md p-6 border border-[var(--color-border)]">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <button (click)="goBack()"
              class="p-2.5 hover:bg-[var(--color-background-hover)] rounded-lg transition-colors border border-[var(--color-border)] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)] focus:ring-offset-2">
              <lucide-angular [img]="backIcon" class="h-5 w-5 text-[var(--color-text)]"></lucide-angular>
            </button>
            <div>
              <h1 class="text-2xl font-bold text-[var(--color-text)]">
                {{ 'workflowApprovalDetail.title' | translate }}
              </h1>
              <div class="flex items-center gap-3 mt-2">
                <p class="text-sm text-[var(--color-text-muted)]">
                  {{ 'workflowApprovalDetail.requestNumber' | translate }} #{{ requestDetail.requestNo }}
                </p>
                <span class="text-[var(--color-text-muted)]">•</span>
                <p class="text-sm text-[var(--color-text-muted)]">
                  {{ requestDetail.requestDate | appDateTime }}
                </p>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span
              class="inline-flex items-center px-4 py-2 rounded-lg border font-medium text-sm shadow-sm {{ getStatusClass(requestDetail.status) }}">
              {{ ('common.statuses.' + requestDetail.status) | translate }}
            </span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="space-y-6">
        <!-- Request Information -->
        <app-workflow-request-information
          [requestDetail]="requestDetail"
          [orderFiles]="orderFiles"
          [destroy$]="destroy$">
        </app-workflow-request-information>


        <!-- Request Items -->
        <app-workflow-request-items
          [requestDetail]="requestDetail"
          (reviewClick)="openWeaponReviewItemsModal()">
        </app-workflow-request-items>

        <!-- Approval Workflow Timeline -->
        <app-workflow-approval-timeline
          [requestDetail]="requestDetail"
          [destroy$]="destroy$">
        </app-workflow-approval-timeline>
      </div>

      <!-- Sidebar -->
      <div class="space-y-6">

        <!-- Pickup Date Management -->
        <app-workflow-pickup-date
          *ngIf="!loading && !error && requestDetail && hasPendingStep()"
          [requestId]="requestId"
          [requestDetail]="requestDetail"
          [(pickupDate)]="pickupDate"
          [destroy$]="destroy$"
          (pickupDateSet)="onPickupDateSet()"
          (pickupDateConfirmed)="onPickupDateConfirmed()"
          (pickupDateChanged)="onPickupDateChanged()">
        </app-workflow-pickup-date>

        <!-- Receiver Information Section (Submit Supply) -->
        <!-- Hide for weapon orders as submission is handled in weapon supply page -->
        <app-workflow-supply-submission
          *ngIf="!loading && !error && requestDetail && canSubmitSupply()"
          class="mt-6"
          [supplyId]="supplyId"
          [supplyData]="supplyData"
          [ranks]="ranks"
          [isLoadingRanks]="isLoadingRanks"
          [destroy$]="destroy$"
          (supplySubmitted)="onSupplySubmitted()"
          (supplyDataChanged)="loadSupplyData()">
        </app-workflow-supply-submission>

        <!-- Approval/Rejection Actions - At the end -->
        <app-workflow-approval-actions
          *ngIf="!loading && !error && requestDetail && canApproveOrReject()"
          class="mt-6"
          [requestId]="requestId"
          [requestDetail]="requestDetail"
          [processing]="processing"
          [previousWorkflowSteps]="previousWorkflowSteps"
          [loadingPreviousSteps]="loadingPreviousSteps"
          [destroy$]="destroy$"
          (approved)="onActionCompleted()"
          (rejected)="onActionCompleted()"
          (returnedForReview)="onActionCompleted()"
          (actionCompleted)="onActionCompleted()"
          (loadPreviousSteps)="loadPreviousWorkflowSteps()">
        </app-workflow-approval-actions>
      </div>

      <app-confirmation-dialog *ngIf="confirmationDialog$ | async as confirmationDialog"
        [isOpen]="confirmationDialog.isOpen" [title]="confirmationDialog.title"
        [message]="confirmationDialog.message" [type]="confirmationDialog.type"
        [confirmText]="confirmationDialog.confirmText" [cancelText]="confirmationDialog.cancelText"
        [requireComment]="confirmationDialog.requireComment" [commentLabel]="confirmationDialog.commentLabel"
        [commentPlaceholder]="confirmationDialog.commentPlaceholder" (confirmed)="onConfirmationConfirmed($event)"
        (cancelled)="onConfirmationCancelled()"></app-confirmation-dialog>

      <!-- Weapon Review Items Modal -->
      <app-weapon-review-items-modal
        [isOpen]="isWeaponReviewItemsModalOpen"
        [requestDetail]="requestDetail"
        (closed)="closeWeaponReviewItemsModal()"
        (itemAdded)="onWeaponItemChanged()"
        (itemUpdated)="onWeaponItemChanged()"
        (itemDeleted)="onWeaponItemChanged()">
      </app-weapon-review-items-modal>
    </div>
  </div>
</div>
