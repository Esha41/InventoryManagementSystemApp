<!-- Full-step loading (first catalog load / item type change); pagination & refresh use list overlay -->
<app-loading-state *ngIf="cartridgeState.loadingCartridges && !cartridgeState.catalogPageLoading" message="common.loading"
    containerClass="bg-[var(--color-background)] rounded-lg p-6 border border-dashed border-[var(--color-border)]">
</app-loading-state>

<!-- Error State -->
<app-error-state *ngIf="!cartridgeState.loadingCartridges && !cartridgeState.catalogPageLoading && cartridgeState.cartridgeError"
    [error]="cartridgeState.cartridgeError || ''" variant="inline" [actionText]="'common.retry'"
    containerClass="bg-[var(--color-error)]/20 border border-[var(--color-error)]/40 rounded-lg p-4"
    messageClass="text-sm text-[var(--color-error)]" (action)="retryLoad.emit()">
</app-error-state>

<!-- Cartridge List View -->
<app-cartridge-list
    *ngIf="(!cartridgeState.loadingCartridges || cartridgeState.catalogPageLoading) && !cartridgeState.cartridgeError"
    [cartridges]="cartridgeState.filteredCartridges" [itemTypeOptions]="displayedItemTypeOptions"
    [ammunitionTypeOptions]="filterOptions.ammunitionTypeOptions" [caliberOptions]="filterOptions.caliberOptions"
    [linkedOptions]="filterOptions.linkedOptions"
    [primaryPurposeOptions]="filterOptions.primaryPurposeOptions"
    [classificationOptions]="filterOptions.classificationOptions"
    [caseTypeOptions]="filterOptions.caseTypeOptions"
    [compatibilityOptions]="filterOptions.compatibilityOptions"
    [hazardDivisionOptions]="filterOptions.hazardDivisionOptions"
    [propellantOptions]="filterOptions.propellantOptions"
    [countryOptions]="filterOptions.countryOptions"
    [weaponTypeOptions]="filterOptions.weaponTypeOptions || []"
    [explosiveTypeOptions]="filterOptions.explosiveTypeOptions || []" [selectedItemType]="filterState.selectedItemType"
    [selectedAmmunitionType]="filterState.selectedAmmunitionType"
    [selectedLinked]="filterState.selectedLinked"
    [selectedPrimaryPurposeId]="filterState.selectedPrimaryPurposeId"
    [selectedClassificationId]="filterState.selectedClassificationId"
    [selectedCaseType]="filterState.selectedCaseType || ''"
    [selectedCompatibility]="filterState.selectedCompatibility || ''"
    [selectedHazardDivision]="filterState.selectedHazardDivision || ''"
    [selectedPropellant]="filterState.selectedPropellant || ''"
    [selectedAmmunitionArmNumber]="filterState.selectedAmmunitionArmNumber || ''"
    [selectedAmmunitionPartNo]="filterState.selectedAmmunitionPartNo || ''"
    [selectedWeaponType]="filterState.selectedWeaponType || ''"
    [selectedCaliber]="filterState.selectedCaliber || ''"
    [selectedCountryOfManufacture]="filterState.selectedCountryOfManufacture || ''"
    [selectedWeaponUNNumber]="filterState.selectedWeaponUNNumber || ''"
    [selectedPartNo]="filterState.selectedPartNo || ''"
    [selectedWeaponModel]="filterState.selectedWeaponModel || ''"
    [selectedWeaponReferenceNo]="filterState.selectedWeaponReferenceNo || ''"
    [selectedExplosiveType]="filterState.selectedExplosiveType || ''"
    [selectedUNNumber]="filterState.selectedUNNumber || ''"
    [selectedExplosiveHazardDivision]="filterState.selectedExplosiveHazardDivision || ''"
    [selectedExplosiveCompatibility]="filterState.selectedExplosiveCompatibility || ''"
    [selectedArmNumber]="filterState.selectedArmNumber || ''"
    [selectedExplosivePartNo]="filterState.selectedExplosivePartNo || ''"
    [selectedExplosiveReferenceNo]="filterState.selectedExplosiveReferenceNo || ''"
    [selectedNSN]="filterState.selectedNSN"
    [canProceed]="canProceed" [fromReserve]="fromReserve" [selectedCartridges]="selectedCartridges"
    [serverSideCatalog]="serverSideCatalog" [catalogPagination]="catalogPagination"
    [appliedSearchTerm]="appliedSearchTerm"
    [catalogPageLoading]="serverSideCatalog && cartridgeState.catalogPageLoading"
    [showPreviousButton]="showPreviousButton"
    (allowanceError)="onAllowanceError($event)"
    (itemTypeValidationError)="onAllowanceError($event)" (addSelection)="addSelection.emit($event)"
    (filterChange)="filterChange.emit()" (clearFilters)="clearFilters.emit()" (next)="next.emit()"
    (previous)="previous.emit()" (searchChange)="onSearchChange($event)" (itemTypeChange)="onItemTypeChange($event)"
    (ammunitionTypeChange)="onAmmunitionTypeChange($event)"
    (linkedChange)="onLinkedChange($event)"
    (primaryPurposeChange)="onPrimaryPurposeChange($event)"
    (classificationChange)="onClassificationChange($event)"
    (caseTypeChange)="onCaseTypeChange($event)"
    (compatibilityChange)="onCompatibilityChange($event)"
    (hazardDivisionChange)="onHazardDivisionChange($event)"
    (propellantChange)="onPropellantChange($event)"
    (weaponTypeChange)="onWeaponTypeChange($event)" (caliberChange)="onCaliberChange($event)"
    (countryOfManufactureChange)="onCountryOfManufactureChange($event)"
    (weaponUNNumberChange)="onWeaponUNNumberChange($event)"
    (explosiveTypeChange)="onExplosiveTypeChange($event)" (unNumberChange)="onUnNumberChange($event)"
    (explosiveHazardDivisionChange)="onExplosiveHazardDivisionChange($event)"
    (explosiveCompatibilityChange)="onExplosiveCompatibilityChange($event)"
    (additionalTextFiltersApply)="onAdditionalTextFiltersApply($event)"
    (removeSelection)="removeSelection.emit($event)"
    (applyCatalogSearch)="applyCatalogSearch.emit($event)" (catalogPageNext)="catalogPageNext.emit()"
    (catalogPagePrev)="catalogPagePrev.emit()">
</app-cartridge-list>

<!-- Allowance Error Banner -->
<app-error-banner *ngIf="(!cartridgeState.loadingCartridges || cartridgeState.catalogPageLoading) && !cartridgeState.cartridgeError && allowanceError"
    [error]="allowanceError" class="mt-4">
</app-error-banner>
