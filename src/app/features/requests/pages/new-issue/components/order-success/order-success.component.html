<div class="bg-[var(--color-background-muted)] rounded-lg py-24 px-12 text-center">
  <h2 class="text-2xl font-bold text-[var(--color-text)] mb-6">{{ titleTranslateKey | translate }}</h2>

  <div class="space-y-2 text-sm text-[var(--color-text)] mb-8">
    <div *ngIf="orderNumber">
      <span class="font-semibold">{{ orderNumberLabelKey | translate }}: </span><span>{{ orderNumber }}</span>
    </div>
  </div>

  <button
    class="px-8 py-3 bg-[var(--color-brand)] text-white text-sm font-medium rounded-lg hover:bg-[var(--color-brand-dark)] transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
    (click)="onTrackOrder()" [disabled]="createdOrderId === null">
    {{ trackButtonTranslateKey | translate }}
  </button>
</div>
