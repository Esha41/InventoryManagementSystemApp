<div *ngIf="error"
  class="bg-[var(--color-error)]/20 border border-[var(--color-error)]/40 text-[var(--color-error)] text-sm rounded-lg p-4"
  [class.flex]="showRetry" [class.items-center]="showRetry" [class.justify-between]="showRetry">
  <span>{{ error | translate }}</span>
  <button *ngIf="showRetry" type="button"
    class="px-3 py-1 border border-[var(--color-error)]/60 rounded hover:bg-[var(--color-error)]/30 ms-4"
    (click)="retry.emit()">
    {{ 'common.retry' | translate }}
  </button>
</div>
