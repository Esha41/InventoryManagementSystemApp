<div class="page-wrapper">
  <div class="page-container space-y-6">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-[var(--color-text)]">
        {{ 'returnRequest.title' | translate }}
      </h1>
    </div>

    <!-- Stepper -->
    <app-stepper
      [steps]="facade.stepperSteps"
      [currentStep]="facade.stepperCurrentStep"
      [animateWhenAmmunitionSelected]="false"
      (stepChange)="facade.onStepperStepChange($event)">
    </app-stepper>

    <!-- Prevent Enter in nested inputs (e.g. catalog search) from submitting the wizard and firing validation -->
    <form (ngSubmit)="$event.preventDefault()">

      <!-- Step 0: same catalog UX as new-issue (step-selection + cartridge list) -->
      <app-step-selection *ngIf="facade.currentStep === 0"
        [cartridgeState]="facade.cartridgeState"
        [filterState]="facade.filterState"
        [filterOptions]="facade.filterOptions"
        [showPreviousButton]="false"
        [fromReserve]="'No'"
        [canProceed]="facade.canProceedFromSelection"
        [selectedCartridges]="facade.selectedCartridges"
        [displayedItemTypeOptions]="facade.displayedItemTypeOptions"
        [serverSideCatalog]="true"
        [catalogPagination]="facade.cartridgeState.catalogPagination"
        [appliedSearchTerm]="facade.filterState.searchTerm"
        (next)="facade.onNext()"
        (previous)="facade.onPrevious()"
        (retryLoad)="facade.retryLoadCartridges()"
        (filterChange)="facade.onFilterSidebarChange()"
        (applyCatalogSearch)="facade.applyCatalogSearch($event)"
        (catalogPageNext)="facade.onCatalogPageNext()"
        (catalogPagePrev)="facade.onCatalogPagePrev()"
        (itemTypeChange)="facade.onStepSelectionItemTypeChange($event)"
        (clearFilters)="facade.onClearFilters()"
        (addSelection)="facade.onCartridgeAdded($event)"
        (removeSelection)="facade.removeItem($event)">
      </app-step-selection>

      <!-- Step 1: Purpose, Notes & Attachments -->
      <app-return-details-step *ngIf="facade.currentStep === 1"
        [requestPurposeId]="facade.detailsState.requestPurposeId"
        [requestPurposeNotes]="facade.detailsState.requestPurposeNotes"
        [reason]="facade.detailsState.reason"
        [priority]="facade.detailsState.priority"
        [selectedFiles]="facade.detailsState.selectedFiles"
        [attachmentRequirements]="facade.selectedAttachmentRequirements"
        [attachmentUploads]="facade.detailsState.attachmentUploads"
        [selectedCartridges]="facade.selectedCartridges"
        [requestPurposes]="facade.lookupState.requestPurposes"
        [priorityOptions]="facade.priorityOptions"
        [isLoadingRequestPurposes]="facade.lookupState.isLoadingRequestPurposes"
        [isLoading]="facade.submissionState.isLoading"
        [hasAttemptedSubmit]="facade.submissionState.hasAttemptedSubmit"
        [hasError]="facade.hasError.bind(facade)"
        [getError]="facade.getError.bind(facade)"
        [requestPurposeOptionLabel]="facade.requestPurposeOptionLabel"
        [getFileSize]="facade.getFileSize"
        (requestPurposeIdChange)="facade.detailsState.requestPurposeId = $event; facade.onRequestPurposeChange()"
        (requestPurposeNotesChange)="facade.detailsState.requestPurposeNotes = $event; facade.onRequestPurposeNotesChange()"
        (reasonChange)="facade.detailsState.reason = $event"
        (priorityChange)="facade.detailsState.priority = $event"
        (attachmentUploadsChange)="facade.onAttachmentUploadsChange($event)"
        (filesSelected)="onFilesSelected($event)"
        (fileRemoved)="onFileRemoved($event)"
        (removeItem)="facade.removeItem($event)"
        (previous)="facade.onPrevious()"
        (next)="facade.onNext()">
      </app-return-details-step>

      <!-- Step 2: Review & Submit -->
      <app-return-review-step *ngIf="facade.currentStep === 2"
        [selectedItemType]="facade.selectionState.selectedItemType"
        [requesterName]="facade.currentRequesterName"
        [requesterDepartment]="facade.currentRequesterDepartmentDisplay"
        [reason]="facade.detailsState.reason"
        [priority]="facade.detailsState.priority"
        [requestPurposeName]="getRequestPurposeNameForReview()"
        [requestPurposeNotes]="facade.detailsState.requestPurposeNotes"
        [selectedFiles]="facade.detailsState.selectedFiles"
        [attachmentRequirements]="facade.selectedAttachmentRequirements"
        [attachmentUploads]="facade.detailsState.attachmentUploads"
        [selectedCartridges]="facade.selectedCartridges"
        [getPriorityLabel]="facade.getPriorityLabel.bind(facade)"
        [isLoading]="facade.submissionState.isLoading"
        (previous)="facade.onPrevious()"
        (submit)="facade.onSubmit()">
      </app-return-review-step>

      <!-- Step 3: Success — same layout/behaviour as new issue `app-order-success` -->
      <app-order-success *ngIf="facade.currentStep === 3"
        [titleTranslateKey]="'returnRequest.success.orderSentSuccessfully'"
        [orderNumberLabelKey]="'returnRequest.success.requestNumber'"
        [trackButtonTranslateKey]="'returnRequest.success.goToDashboard'"
        [orderNumber]="facade.successState.returnNumber"
        [createdOrderId]="facade.successState.createdReturnId"
        (trackOrder)="facade.onTrackReturn()">
      </app-order-success>

    </form>
  </div>

  <!-- Confirmation Dialog -->
  <app-confirmation-dialog
    [isOpen]="facade.confirmDialogConfig.show"
    [title]="facade.confirmDialogConfig.title"
    [message]="facade.confirmDialogConfig.message"
    [type]="facade.confirmDialogConfig.type"
    [confirmText]="facade.confirmDialogConfig.confirmText"
    [cancelText]="facade.confirmDialogConfig.cancelText"
    [closeOnBackdrop]="true"
    (confirmed)="facade.onConfirmSubmit()"
    (cancelled)="facade.onCancelConfirm()">
  </app-confirmation-dialog>

</div>
