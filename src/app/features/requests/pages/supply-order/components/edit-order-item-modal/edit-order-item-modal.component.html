<app-modal [isOpen]="isOpen" [title]="'supplyOrder.editItemQuantity' | translate" size="md" (closed)="closeModal()">
  <div *ngIf="selectedItem"
    class="mb-4 p-4 bg-[var(--color-background-active)] rounded-lg border-2 border-[var(--color-border)]">
    <p class="text-sm font-semibold text-[var(--color-text)] mb-1">{{ 'supplyOrder.item' | translate }}:</p>
    <p class="text-base text-[var(--color-text)]">{{ selectedItem.itemName }}</p>
    <p class="text-xs text-[var(--color-text-muted)] mt-1">{{ 'supplyOrder.productId' | translate }}: {{
      getItemProductId(selectedItem) }}</p>
  </div>

  <form [formGroup]="editItemForm" class="space-y-4">
    <!-- Quantity -->
    <div>
      <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
        {{ 'supplyOrder.quantity' | translate }} <span class="text-[var(--color-error)]">*</span>
      </label>
      <input type="number" formControlName="quantity" min="1"
        class="w-full px-3 py-2 border-2 rounded-lg text-sm bg-[var(--color-background)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
        [ngClass]="{
          'border-[var(--color-error)]': editItemForm.get('quantity')?.invalid && editItemForm.get('quantity')?.touched,
          'border-[var(--color-border)]': !(editItemForm.get('quantity')?.invalid && editItemForm.get('quantity')?.touched)
        }" />
      <p *ngIf="editItemForm.get('quantity')?.errors?.['required'] && editItemForm.get('quantity')?.touched"
        class="mt-1 text-sm text-[var(--color-error)]">
        {{ 'supplyOrder.quantityRequired' | translate }}
      </p>
      <p *ngIf="editItemForm.get('quantity')?.errors?.['min'] && editItemForm.get('quantity')?.touched"
        class="mt-1 text-sm text-[var(--color-error)]">
        {{ 'supplyOrder.quantityMinError' | translate:{min: totalSupplied} }}
      </p>
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
        {{ 'supplyOrder.notes' | translate }}
      </label>
      <textarea formControlName="notes" rows="3"
        class="w-full px-3 py-2 border-2 border-[var(--color-border)] rounded-lg text-sm bg-[var(--color-background)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]"
        placeholder="{{ 'supplyOrder.notesPlaceholder' | translate }}"></textarea>
    </div>
  </form>

  <div modal-footer class="flex gap-3">
    <button (click)="closeModal()"
      class="px-4 py-2 border-2 border-[var(--color-border)] rounded-lg text-sm font-medium text-[var(--color-text)] hover:bg-[var(--color-background-hover)] transition-colors">
      {{ 'common.cancel' | translate }}
    </button>
    <button (click)="onSaveEditOrderItem()" [disabled]="editItemForm.invalid || savingItem"
      class="px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      [ngClass]="{
        'bg-[var(--color-brand)] hover:bg-[var(--color-brand-dark)]': !editItemForm.invalid && !savingItem,
        'bg-[var(--color-text-muted)]': editItemForm.invalid || savingItem
      }">
      <span *ngIf="!savingItem">{{ 'common.save' | translate }}</span>
      <span *ngIf="savingItem">{{ 'common.saving' | translate }}</span>
    </button>
  </div>
</app-modal>
