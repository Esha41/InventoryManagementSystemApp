<div class="page-wrapper">
  <div class="page-container">
    <!-- Header -->
    <div class="mb-8 md:mb-12 flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0">
      <h1 class="text-3xl md:text-4xl font-bold text-[var(--color-text)] text-center sm:text-start">
        {{ 'warehouse.title' | translate }}
      </h1>
      <button *appHasPermission="'WarehouseMapView'" (click)="onViewOnMap()"
        class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2 bg-[var(--color-brand)] text-white rounded-lg font-medium hover:bg-[var(--color-brand-dark)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)] focus:ring-offset-2 shadow-sm">
        <lucide-angular [img]="Map" class="w-4 h-4"></lucide-angular>
        <span>{{ 'warehouse.viewOnMap' | translate }}</span>
      </button>
    </div>

    <!-- Loading State -->
    <app-loading-state *ngIf="loading" size="lg" [fullPage]="true">
    </app-loading-state>

    <!-- Error State -->
    <app-error-state *ngIf="error && !loading" [error]="error || ''" variant="inline" title="common.error"
      containerClass="mb-8" actionText="common.retry" (action)="refreshWarehouses()">
    </app-error-state>

    <!-- Warehouse Cards -->
    <div *ngIf="!loading && !error" class="grid grid-cols-1 gap-6 max-w-4xl mx-auto">
      <div *ngFor="let warehouse of warehouses; trackBy: trackByStringId"
        class="bg-[var(--color-background)] border-2 border-[var(--color-border)] rounded-xl shadow-custom-md hover:shadow-custom-lg transition-all duration-300 p-6 md:p-8">

        <!-- Warehouse Emblem and Name -->
        <div class="flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-start mb-6">
          <!-- Military Emblem with Logo -->
          <div
            class="w-20 h-20 bg-gradient-to-br from-red-800 to-red-900 rounded-full flex items-center justify-center border-4 border-yellow-400 shadow-lg mb-4 sm:mb-0 sm:me-6 overflow-hidden military-emblem flex-shrink-0">
            <img src="assets/image 8.png" alt="ETTAD Logo" class="warehouse-logo" loading="lazy">
          </div>
          <div class="flex-1">
            <h3 class="text-xl md:text-2xl font-bold text-[var(--color-text)] mb-2">{{ warehouse.name }}</h3>
            <p class="text-[var(--color-text-muted)] text-sm break-all">{{ warehouse.code }}</p>
          </div>
        </div>

        <!-- TODO: Replace with actual API data when backend is ready -->
        <!-- Statistics Progress Bars -->
        <!-- <div class="mb-6 space-y-4">
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-[var(--color-text-muted)]">{{ 'warehouse.neq' | translate }}</span>
              <span class="text-sm font-bold text-[var(--color-text)]">{{ warehouse.neqPercentage }}%</span>
            </div>
            <div class="w-full bg-[var(--color-background-active)] rounded-full h-4 overflow-hidden">
              <div class="progress-fill-orange h-full rounded-full transition-all duration-500 ease-out"
                [style.width.%]="warehouse.neqPercentage">
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-[var(--color-text-muted)]">{{ 'warehouse.consumed' | translate
                }}</span>
              <span class="text-sm font-bold text-[var(--color-text)]">{{ warehouse.consumedPercentage }}%</span>
            </div>
            <div class="w-full bg-[var(--color-background-active)] rounded-full h-4 overflow-hidden">
              <div class="progress-fill-green h-full rounded-full transition-all duration-500 ease-out"
                [style.width.%]="warehouse.consumedPercentage">
              </div>
            </div>
          </div>
        </div> -->

        <!-- Warehouse Info and Actions -->
        <div
          class="flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0 pt-4 border-t border-[var(--color-border)]">
          <!-- Warehouse Info -->
          <div class="space-y-1 w-full sm:w-auto text-center sm:text-start">
            <div class="text-xs text-[var(--color-text-muted)]">
              <span class="font-medium">{{ 'warehouse.location' | translate }}:</span>
              <span class="ms-2">{{ warehouse.code }}</span>
            </div>
          </div>

          <!-- View Button -->
          <div class="w-full sm:w-auto">
            <button (click)="onViewWarehouse(warehouse.id)"
              class="w-full sm:w-auto bg-[var(--color-brand)] hover:bg-[var(--color-brand-dark)] text-white font-semibold py-2.5 px-6 rounded-lg transition-colors duration-200">
              <span>{{ 'warehouse.viewInventory' | translate }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && warehouses.length === 0" class="text-center py-20">
      <div
        class="w-32 h-32 mx-auto mb-6 bg-[var(--color-background-active)] rounded-full flex items-center justify-center">
        <svg class="w-16 h-16 text-[var(--color-text-muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h3 class="text-2xl font-medium text-[var(--color-text)] mb-4">{{ 'warehouse.noWarehouses' | translate }}</h3>
      <p class="text-[var(--color-text-muted)] text-lg">{{ 'warehouse.noWarehousesDescription' | translate }}</p>
    </div>
  </div>
</div>
