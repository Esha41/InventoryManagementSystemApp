<div class="page-wrapper">
  <!-- Header -->
  <div class="bg-[var(--color-background-muted)] border-b border-[var(--color-border)]">
    <div class="page-container py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button (click)="onBackToWarehouses()"
            class="flex items-center gap-2 text-[var(--color-text-muted)] hover:text-[var(--color-text)] transition-colors">
            <lucide-angular [img]="backIcon" class="w-5 h-5"></lucide-angular>
            <span class="font-medium">{{ 'warehouseInventory.backToWarehouses' | translate }}</span>
          </button>
        </div>
      </div>
    </div>

    <div class="page-container">
      <!-- Page Title -->
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-[var(--color-text)] mb-2">
            {{ depoName }} {{ 'warehouseInventory.inventory' | translate }}
          </h1>
          <p class="text-sm text-[var(--color-text-muted)]">
            {{ 'warehouseInventory.totalItems' | translate }}: {{ activeTab === 'weapon' ? filteredWeaponAssets.length :
            filteredInventoryDetails.length }}
          </p>
        </div>
        <div class="flex items-center gap-3">
          <!-- Add Inventory Button (for Ammunition & Explosives) -->
          <ng-container *ngIf="activeTab !== 'weapon'">
            <button *appHasPermission="'Inventory.Create'" (click)="onAddInventory()"
              class="px-6 py-3 bg-[var(--color-brand)] text-white rounded-lg hover:bg-[var(--color-brand-dark)] transition-colors shadow-sm">
              + {{ 'warehouseInventory.addInventory' | translate }}
            </button>
          </ng-container>

          <!-- Add Weapon Asset Button (for Weapons) -->
          <ng-container *ngIf="activeTab === 'weapon'">
            <button *appHasPermission="'Asset.Create'" (click)="onAddWeaponAsset()"
              class="px-6 py-3 bg-[var(--color-brand)] text-white rounded-lg hover:bg-[var(--color-brand-dark)] transition-colors shadow-sm">
              + {{ 'warehouseInventory.addWeaponAsset' | translate }}
            </button>
          </ng-container>
        </div>
      </div>

      <!-- Enhanced Tabs -->
      <div
        class="mb-6 bg-[var(--color-background)] border-2 border-[var(--color-border)] rounded-lg shadow-custom-sm overflow-hidden">
        <div class="bg-[var(--color-background-muted)]">
          <nav class="flex gap-1 p-2" aria-label="Tabs">
            <button (click)="switchTab('ammunition')" [ngClass]="{
              'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeTab === 'ammunition',
              'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeTab !== 'ammunition'
            }"
              class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 relative overflow-hidden group">
              <div class="flex items-center gap-2 relative z-10">
                <div class="w-2 h-2 rounded-full transition-all duration-200" [ngClass]="{
                     'bg-white': activeTab === 'ammunition',
                     'bg-[var(--color-brand)]': activeTab !== 'ammunition'
                   }"></div>
                <span>{{ 'warehouseInventory.tabs.ammunition' | translate }}</span>
              </div>
              <div *ngIf="activeTab === 'ammunition'"
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent animate-shimmer">
              </div>
            </button>
            <button (click)="switchTab('explosive')" [ngClass]="{
              'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeTab === 'explosive',
              'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeTab !== 'explosive'
            }"
              class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 relative overflow-hidden group">
              <div class="flex items-center gap-2 relative z-10">
                <div class="w-2 h-2 rounded-full transition-all duration-200" [ngClass]="{
                     'bg-white': activeTab === 'explosive',
                     'bg-[var(--color-brand)]': activeTab !== 'explosive'
                   }"></div>
                <span>{{ 'warehouseInventory.tabs.explosive' | translate }}</span>
              </div>
              <div *ngIf="activeTab === 'explosive'"
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent animate-shimmer">
              </div>
            </button>
            <button (click)="switchTab('weapon')" [ngClass]="{
              'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeTab === 'weapon',
              'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeTab !== 'weapon'
            }"
              class="flex items-center gap-2 px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 relative overflow-hidden group">
              <div class="flex items-center gap-2 relative z-10">
                <div class="w-2 h-2 rounded-full transition-all duration-200" [ngClass]="{
                     'bg-white': activeTab === 'weapon',
                     'bg-[var(--color-brand)]': activeTab !== 'weapon'
                   }"></div>
                <span>{{ 'warehouseInventory.tabs.weapon' | translate }}</span>
              </div>
              <div *ngIf="activeTab === 'weapon'"
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent animate-shimmer">
              </div>
            </button>
          </nav>
        </div>
      </div>

      <!-- Search Bar -->
      <app-inventory-filters [searchControl]="searchControl">
      </app-inventory-filters>

      <!-- Loading State -->
      <app-loading-state *ngIf="loading" size="lg" [fullPage]="true">
      </app-loading-state>

      <!-- Error State -->
      <app-error-state *ngIf="error && !loading" [error]="error || ''" variant="inline" title="common.error"
        containerClass="mb-8">
      </app-error-state>

      <!-- Inventory Table -->
      <app-card *ngIf="!loading && !error" [shadow]="true">
        <div class="overflow-x-auto">
          <!-- Weapon Assets Table -->
          <app-asset-table *ngIf="activeTab === 'weapon'" [assets]="paginatedAssets"
            [getAssetItemName]="getAssetItemName" (editAsset)="onEditAsset($event)"
            (deleteAsset)="onDeleteAsset($event)" (viewAsset)="onViewAsset($event)">
          </app-asset-table>

          <!-- Inventory Items Table (Ammunition & Explosives) -->
          <app-inventory-table *ngIf="activeTab !== 'weapon'" [items]="paginatedItems"
            [isStaticItem]="isStaticItem.bind(this)" [getItemName]="getItemName" [getSupplierName]="getSupplierName"
            [formatNumber]="formatNumber" [formatDate]="formatDate" (editItem)="onEditItem($event)"
            (deleteItem)="onDeleteItem($event)" (viewItem)="onViewItem($event)">
          </app-inventory-table>
        </div>

        <!-- Pagination Footer - Outside table overflow container -->
        <div
          *ngIf="(activeTab === 'weapon' ? filteredWeaponAssets.length : filteredInventoryDetails.length) > 0 && !loading"
          class="border-t border-[var(--color-border)] bg-[var(--color-background-muted)] px-6 py-4">
          <div class="flex items-center justify-between w-full flex-nowrap">
            <!-- Rows Per Page Selector -->
            <app-rows-per-page [rowsPerPage]="rowsPerPage"
              [totalItems]="activeTab === 'weapon' ? filteredWeaponAssets.length : filteredInventoryDetails.length"
              [visibleItems]="activeTab === 'weapon' ? paginatedAssets.length : paginatedItems.length"
              (rowsPerPageChange)="onRowsPerPageChange($event)">
            </app-rows-per-page>

            <!-- Pagination Controls -->
            <div *ngIf="totalPages > 1" class="flex items-center gap-3 flex-shrink-0 ms-4">
              <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)">
              </app-pagination>
              <span class="text-sm text-[var(--color-text-muted)] whitespace-nowrap">
                {{ currentPage }} {{ 'common.of' | translate }} {{ totalPages }}
              </span>
            </div>
          </div>
        </div>
      </app-card>
    </div>
  </div>

  <!-- Edit Modal -->
  <app-edit-inventory-detail-modal [isOpen]="showEditModal" [inventoryDetail]="selectedDetail"
    [inventoryId]="selectedDetail?.inventoryId || 0" (closed)="onEditModalClose()" (saved)="onEditSave($event)">
  </app-edit-inventory-detail-modal>

  <!-- Delete Confirmation Dialog -->
  <app-confirm-dialog [isOpen]="showDeleteDialog" [title]="'deleteConfirmation.title' | translate"
    [message]="'deleteConfirmation.message' | translate"
    [description]="('deleteConfirmation.item' | translate) + ': ' + getItemName(selectedDetail)"
    [confirmText]="'deleteConfirmation.confirmDelete' | translate"
    [cancelText]="'deleteConfirmation.cancel' | translate" confirmVariant="danger" (confirmed)="onDeleteConfirm()"
    (cancelled)="onDeleteCancel()">
  </app-confirm-dialog>

  <!-- Edit Asset Modal -->
  <app-edit-asset-modal [isOpen]="showEditAssetModal" [asset]="selectedAsset || null" [loading]="loadingAsset"
    (closed)="onEditAssetModalClosed()" (saved)="onEditAssetModalSaved()">
  </app-edit-asset-modal>

  <!-- Delete Asset Confirmation Dialog -->
  <app-confirm-dialog [isOpen]="showDeleteAssetDialog" [title]="'warehouseInventory.deleteAssetConfirm' | translate"
    [message]="('warehouseInventory.deleteAssetConfirm' | translate) + ': ' + getDeleteAssetMessage()"
    [description]="'warehouseInventory.deleteAssetWarning' | translate" [confirmText]="'common.delete' | translate"
    [cancelText]="'common.cancel' | translate" confirmVariant="danger" (confirmed)="onDeleteAssetConfirm()"
    (cancelled)="onDeleteAssetCancel()">
  </app-confirm-dialog>
