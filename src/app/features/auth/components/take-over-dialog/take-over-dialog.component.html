<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50"
  role="dialog"
  aria-modal="true"
  aria-labelledby="takeOverDialogTitle"
>
  <div
    class="bg-[var(--color-background)] rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border-2 border-[var(--color-border)]"
  >
    <h3 id="takeOverDialogTitle" class="text-lg font-bold text-[var(--color-text)]">
      {{ 'auth.login.alreadyLoggedInTitle' | translate }}
    </h3>
    <p class="text-sm text-[var(--color-text-muted)] leading-relaxed">
      {{
        'auth.login.takeOverSessionBody'
          | translate
            : { existingSessionUser: existingSessionUser, requestingUser: requestingUser }
      }}
    </p>
    <div class="flex flex-wrap gap-3 pt-2 justify-end">
      <button
        type="button"
        (click)="cancel.emit()"
        class="min-h-[2.75rem] px-4 py-2.5 rounded-xl border-2 border-[var(--color-border)]
               bg-[var(--color-background-muted)] text-[var(--color-text)] hover:bg-[var(--color-background)] transition-colors"
      >
        {{ 'auth.login.takeOverCancel' | translate }}
      </button>
      <button
        type="button"
        (click)="confirm.emit()"
        class="min-h-[2.75rem] px-4 py-2.5 rounded-xl bg-[var(--color-brand)] text-white
               font-semibold hover:bg-[var(--color-brand-dark)] transition-colors"
      >
        {{ 'auth.login.takeOverConfirm' | translate }}
      </button>
    </div>
  </div>
</div>
