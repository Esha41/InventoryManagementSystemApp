<div class="space-y-8">
  <!-- Header -->
  <div class="text-center space-y-2">
    <h2 class="text-2xl font-bold text-[var(--color-text)] tracking-tight">{{ 'auth.login.title' | translate }}</h2>
    <p class="text-sm text-[var(--color-text-muted)] leading-relaxed">
      {{ 'auth.login.subtitle' | translate }}
    </p>
  </div>

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
    <!-- Mode Tabs -->
    <div class="flex items-center justify-center rounded-2xl bg-[var(--color-background-muted)] p-1">
      <!-- Development: Password first, LDAP second -->
      <ng-container *ngIf="isDevelopment">
        <button type="button" (click)="setLoginMode('password')" [class]="
            'flex-1 px-4 py-2 text-sm font-semibold rounded-xl transition-all duration-200 ' +
            (isLdapMode
              ? 'text-[var(--color-text-muted)] hover:text-[var(--color-text)]'
              : 'bg-[var(--color-background)] text-[var(--color-brand)] shadow-sm border-2 border-[var(--color-brand)]/20')
          ">
          {{ 'auth.login.passwordLogin' | translate }}
        </button>
        <button type="button" (click)="setLoginMode('ldap')" [class]="
            'flex-1 px-4 py-2 text-sm font-semibold rounded-xl transition-all duration-200 ' +
            (!isLdapMode
              ? 'text-[var(--color-text-muted)] hover:text-[var(--color-text)]'
              : 'bg-[var(--color-background)] text-[var(--color-brand)] shadow-sm border-2 border-[var(--color-brand)]/20')
          ">
          {{ 'auth.login.ldapLogin' | translate }}
        </button>
      </ng-container>
      <!-- Production/Staging: LDAP first, Password second -->
      <ng-container *ngIf="!isDevelopment">
        <button type="button" (click)="setLoginMode('ldap')" [class]="
            'flex-1 px-4 py-2 text-sm font-semibold rounded-xl transition-all duration-200 ' +
            (!isLdapMode
              ? 'text-[var(--color-text-muted)] hover:text-[var(--color-text)]'
              : 'bg-[var(--color-background)] text-[var(--color-brand)] shadow-sm border-2 border-[var(--color-brand)]/20')
          ">
          {{ 'auth.login.ldapLogin' | translate }}
        </button>
        <button type="button" (click)="setLoginMode('password')" [class]="
            'flex-1 px-4 py-2 text-sm font-semibold rounded-xl transition-all duration-200 ' +
            (isLdapMode
              ? 'text-[var(--color-text-muted)] hover:text-[var(--color-text)]'
              : 'bg-[var(--color-background)] text-[var(--color-brand)] shadow-sm border-2 border-[var(--color-brand)]/20')
          ">
          {{ 'auth.login.passwordLogin' | translate }}
        </button>
      </ng-container>
    </div>

    <!-- Username Field -->
    <div class="space-y-2">
      <label for="username" class="block text-sm font-semibold text-[var(--color-text)]">
        {{ 'auth.login.username' | translate }}
      </label>
      <div class="relative group">
        <div class="absolute inset-y-0 flex items-center pointer-events-none z-10"
          [ngClass]="{'start-0 ps-4': !isRTL, 'end-0 pe-4': isRTL}">
          <lucide-angular [img]="User"
            class="h-5 w-5 text-[var(--color-text-muted)] group-focus-within:text-[var(--color-brand)] transition-colors duration-200" />
        </div>
        <input id="username" type="text" formControlName="username" autocomplete="username" class="block w-full py-3.5 text-base
                 border-2 border-[var(--color-border)] rounded-xl
                 bg-[var(--color-background)] text-[var(--color-text)]
                 outline-none focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20
                 placeholder:text-[var(--color-text-light)]
                 transition-all duration-200
                 disabled:bg-[var(--color-background-muted)] disabled:cursor-not-allowed"
          [ngClass]="{'ps-12 pe-4': !isRTL, 'pe-12 ps-4': isRTL}"
          [placeholder]="'auth.login.usernamePlaceholder' | translate"
          [class.border-red-500]="username?.invalid && username?.touched" style="text-align: start;" />
      </div>
      <p *ngIf="getFieldError('username')"
        class="mt-2 text-sm font-medium text-[var(--color-error)] flex items-center gap-1">
        <lucide-angular [img]="AlertCircle" class="h-4 w-4"></lucide-angular>
        {{ getFieldError('username') }}
      </p>
    </div>

    <!-- Password Field -->
    <div class="space-y-2">
      <label for="password" class="block text-sm font-semibold text-[var(--color-text)]">
        {{ 'auth.login.password' | translate }}
      </label>
      <div class="relative group">
        <div class="absolute inset-y-0 flex items-center pointer-events-none z-10"
          [ngClass]="{'start-0 ps-4': !isRTL, 'end-0 pe-4': isRTL}">
          <lucide-angular [img]="Lock"
            class="h-5 w-5 text-[var(--color-text-muted)] group-focus-within:text-[var(--color-brand)] transition-colors duration-200" />
        </div>
        <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
          autocomplete="current-password" class="block w-full py-3.5 text-base
                 border-2 border-[var(--color-border)] rounded-xl
                 bg-[var(--color-background)] text-[var(--color-text)]
                 outline-none focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20
                 placeholder:text-[var(--color-text-light)]
                 transition-all duration-200
                 disabled:bg-[var(--color-background-muted)] disabled:cursor-not-allowed"
          [ngClass]="{'ps-12 pe-12': !isRTL, 'pe-12 ps-12': isRTL}"
          [placeholder]="'auth.login.passwordPlaceholder' | translate"
          [class.border-red-500]="password?.invalid && password?.touched" style="text-align: start;" />
        <button type="button" (click)="togglePasswordVisibility()" tabindex="-1"
          class="absolute inset-y-0 flex items-center z-10 group/toggle"
          [ngClass]="{'end-0 pe-4': !isRTL, 'start-0 ps-4': isRTL}"
          [attr.aria-label]="showPassword ? ('common.hidePassword' | translate) : ('common.showPassword' | translate)">
          <lucide-angular [img]="showPassword ? EyeOff : Eye"
            class="h-5 w-5 text-[var(--color-text-muted)] group-hover/toggle:text-[var(--color-text)] transition-colors duration-200" />
        </button>
      </div>
      <p *ngIf="getFieldError('password')"
        class="mt-2 text-sm font-medium text-[var(--color-error)] flex items-center gap-1">
        <lucide-angular [img]="AlertCircle" class="h-4 w-4"></lucide-angular>
        {{ getFieldError('password') }}
      </p>
      <!-- Forgot Password Link -->
      <div class="mt-2 text-end">
        <a routerLink="/auth/forgot-password"
          class="text-sm font-semibold text-[var(--color-brand)] hover:text-[var(--color-brand-dark)] transition-colors">
          {{ 'auth.login.forgotPassword' | translate }}
        </a>
      </div>
    </div>

    <!-- Captcha Field -->
    <div class="space-y-2" *ngIf="showCaptcha">
      <label for="captcha" class="block text-sm font-semibold text-[var(--color-text)]">
        {{ 'auth.login.captcha' | translate }} <span class="text-[var(--color-error)]">*</span>
      </label>
      <div class="flex items-center gap-3">
        <div class="flex-1 relative">
          <input id="captcha" type="text" formControlName="captcha" autocomplete="off" class="block w-full py-3.5 text-base
                   border-2 border-[var(--color-border)] rounded-xl
                   bg-[var(--color-background)] text-[var(--color-text)]
                   outline-none focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20
                   placeholder:text-[var(--color-text-light)]
                   transition-all duration-200
                   disabled:bg-[var(--color-background-muted)] disabled:cursor-not-allowed
                   ps-4 pe-4" [placeholder]="'auth.login.captchaPlaceholder' | translate"
            [class.border-red-500]="captcha?.invalid && captcha?.touched" style="text-align: start;" />
        </div>
        <div class="flex items-center gap-2">
          <div
            class="border-2 border-[var(--color-border)] rounded-xl bg-[var(--color-background-muted)] p-2 min-w-[120px] h-[52px] flex items-center justify-center">
            <img *ngIf="captchaImage && !isLoadingCaptcha" [src]="captchaImage" alt="Captcha"
              class="max-h-full max-w-full object-contain cursor-pointer" (error)="onCaptchaImageError()"
              (click)="refreshCaptcha()" title="Click to refresh captcha" />
            <svg *ngIf="isLoadingCaptcha" class="animate-spin h-6 w-6 text-[var(--color-text-muted)]"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
          </div>
          <button type="button" (click)="refreshCaptcha()" class="p-2.5 rounded-xl border-2 border-[var(--color-border)] 
                   bg-[var(--color-background)] text-[var(--color-text-muted)]
                   hover:bg-[var(--color-background-muted)] hover:text-[var(--color-text)]
                   hover:border-[var(--color-brand)]/50
                   focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]/20
                   transition-all duration-200
                   disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="isLoadingCaptcha"
            [attr.aria-label]="'auth.login.refreshCaptcha' | translate">
            <lucide-angular [img]="RefreshCw" [class.animate-spin]="isLoadingCaptcha" class="h-5 w-5"></lucide-angular>
          </button>
        </div>
      </div>
      <p *ngIf="getFieldError('captcha')"
        class="mt-2 text-sm font-medium text-[var(--color-error)] flex items-center gap-1">
        <lucide-angular [img]="AlertCircle" class="h-4 w-4"></lucide-angular>
        {{ getFieldError('captcha') }}
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="loginError"
      class="bg-[var(--color-error)]/5 border-2 border-[var(--color-error)]/20 rounded-xl p-4 animate-in fade-in duration-200"
      role="alert">
      <div class="flex items-start gap-3">
        <lucide-angular [img]="AlertCircle" class="h-5 w-5 text-[var(--color-error)] flex-shrink-0"></lucide-angular>
        <p class="text-sm font-medium text-[var(--color-error)] leading-relaxed">
          {{ loginError }}
        </p>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit" [disabled]="isLoginDisabled" class="w-full bg-[var(--color-brand)] text-white font-semibold
               py-3.5 px-6 rounded-xl
               hover:bg-[var(--color-brand-dark)] 
               focus:outline-none focus:ring-4 focus:ring-[var(--color-brand)]/20
               active:scale-[0.98]
               disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-[var(--color-brand)]
               transition-all duration-200
               shadow-sm hover:shadow-md">
        <span *ngIf="!isLoading" class="inline-flex items-center justify-center gap-2" [style.direction]="'ltr'">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0 transition-all duration-300 ease-in-out"
            [style.transform]="isRTL ? 'scaleX(-1)' : 'scaleX(1)'" [style.order]="isRTL ? '1' : '2'"
            [style.margin-right]="isRTL ? '0.5rem' : '0'" [style.margin-left]="!isRTL ? '0.5rem' : '0'"
            viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
              clip-rule="evenodd" />
          </svg>
          <span [style.direction]="isRTL ? 'rtl' : 'ltr'" [style.order]="isRTL ? '2' : '1'">{{ 'auth.login.signIn' |
            translate }}</span>
        </span>
        <span *ngIf="isLoading" class="inline-flex items-center justify-center gap-3">
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <span>{{ 'auth.login.signingIn' | translate }}</span>
        </span>
      </button>
    </div>
  </form>
</div>
