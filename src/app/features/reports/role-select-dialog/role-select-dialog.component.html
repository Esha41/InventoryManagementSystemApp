<app-modal
  [isOpen]="isOpen"
  [title]="'reportDesigner.selectRoles' | translate"
  size="lg"
  [closeOnBackdrop]="false"
  (closed)="onCancel()">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-12">
    <div class="text-center">
      <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-[var(--color-primary)] border-r-transparent"></div>
      <p class="mt-4 text-sm text-[var(--color-text-muted)]">{{ 'common.loading' | translate }}</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="text-center py-8">
    <p class="text-sm text-[var(--color-error)]">{{ error }}</p>
  </div>

  <!-- Search Input -->
  <div *ngIf="!loading && !error && roles.length > 0" class="mb-4">
    <div
      class="flex items-center gap-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-background)] px-3 py-2 focus-within:ring-2 focus-within:ring-[var(--color-primary)]/40">
      <lucide-angular [img]="Search" class="h-4 w-4 text-[var(--color-text-muted)] flex-shrink-0"></lucide-angular>
      <input
        type="search"
        class="w-full bg-transparent text-sm text-[var(--color-text)] outline-none placeholder-[var(--color-text-muted)]"
        [placeholder]="'common.search' | translate"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange($any($event.target).value)" />
      <button
        *ngIf="searchTerm"
        type="button"
        (click)="clearSearch()"
        class="flex-shrink-0 text-[var(--color-text-muted)] hover:text-[var(--color-text)] transition-colors">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Roles List -->
  <div *ngIf="!loading && !error" class="space-y-2 max-h-96 overflow-y-auto">
    <ng-container *ngFor="let role of filteredRoles">
      <button
        type="button"
        (click)="toggleRole(getRoleId(role))"
        [ngClass]="{
          'w-full p-3 rounded-lg border-2 transition-all text-left hover:border-[var(--color-primary)] hover:shadow-sm': true,
          'border-[var(--color-primary)] bg-[var(--color-primary)]/5': isRoleSelected(getRoleId(role)),
          'border-[var(--color-border)]': !isRoleSelected(getRoleId(role))
        }">
        <div class="flex items-center gap-3">
          <div class="flex-shrink-0">
            <div
              class="h-10 w-10 rounded-lg flex items-center justify-center transition-colors"
              [ngClass]="{
                'bg-[var(--color-primary)]/10': !isRoleSelected(getRoleId(role)),
                'bg-[var(--color-primary)]/20': isRoleSelected(getRoleId(role))
              }">
              <lucide-angular [img]="Users" class="h-5 w-5 text-[var(--color-primary)]"></lucide-angular>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-semibold text-[var(--color-text)]">{{ getRoleDisplayName(role) }}</h3>
            <p *ngIf="role.name && role.nameEn && role.name !== role.nameEn" class="text-xs text-[var(--color-text-muted)] mt-0.5">
              {{ role.name }}
            </p>
          </div>
          <div *ngIf="isRoleSelected(getRoleId(role))" class="flex-shrink-0">
            <lucide-angular [img]="Check" class="h-5 w-5 text-[var(--color-primary)]"></lucide-angular>
          </div>
        </div>
      </button>
    </ng-container>
  </div>

  <!-- Empty State (No roles at all) -->
  <div *ngIf="!loading && !error && roles.length === 0" class="text-center py-12">
    <p class="text-sm text-[var(--color-text-muted)]">{{ 'reportDesigner.noRoles' | translate }}</p>
  </div>

  <!-- Empty Search Results -->
  <div *ngIf="!loading && !error && roles.length > 0 && filteredRoles.length === 0" class="text-center py-12">
    <p class="text-sm text-[var(--color-text-muted)]">{{ 'reportDesigner.noRolesFound' | translate }}</p>
    <button
      type="button"
      (click)="clearSearch()"
      class="mt-2 text-sm text-[var(--color-primary)] hover:underline">
      {{ 'common.clearSearch' | translate }}
    </button>
  </div>

  <!-- Info Message -->
  <div *ngIf="!loading && !error && filteredRoles.length > 0" class="mt-4 p-3 rounded-lg bg-[var(--color-info)]/10 border border-[var(--color-info)]/20">
    <p class="text-xs text-[var(--color-text-muted)]">
      {{ 'reportDesigner.roleSelectionInfo' | translate }}
    </p>
  </div>

  <div modal-footer class="flex gap-3 justify-end">
    <app-button
      variant="outline"
      (clicked)="onCancel()">
      {{ 'common.cancel' | translate }}
    </app-button>
    <app-button
      variant="primary"
      (clicked)="onConfirm()">
      {{ 'common.confirm' | translate }}
    </app-button>
  </div>
</app-modal>
