<div class="page-wrapper">
  <!-- Header -->
  <div class="bg-[var(--color-background-muted)] border-b-2 border-[var(--color-border)]">
    <div class="page-container py-4 sm:py-5">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-[var(--color-text)]">
            {{ 'adminImportExport.title' | translate }}
          </h1>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container">
    <!-- Section Tabs -->
    <app-card [shadow]="true" class="mb-6 overflow-hidden min-w-0">
      <div class="section-tabs-scroll bg-gradient-to-r from-[var(--color-background)] to-[var(--color-background-hover)]">
        <nav class="flex gap-1 p-2 w-max min-w-full" aria-label="Sections">
          <button (click)="switchSection('assets')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection() === 'assets',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection() !== 'assets'
          }"
            class="flex items-center gap-2 px-4 sm:px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 flex-shrink-0 whitespace-nowrap">
            <span>{{ 'adminImportExport.sections.assets' | translate }}</span>
          </button>
          <button (click)="switchSection('inventory-summary')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection() === 'inventory-summary',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection() !== 'inventory-summary'
          }"
            class="flex items-center gap-2 px-4 sm:px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 flex-shrink-0 whitespace-nowrap">
            <span>{{ 'adminImportExport.sections.inventorySummary' | translate }}</span>
          </button>
          <button (click)="switchSection('warehouse-inventory')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-lg scale-105': activeSection() === 'warehouse-inventory',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': activeSection() !== 'warehouse-inventory'
          }"
            class="flex items-center gap-2 px-4 sm:px-6 py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102 flex-shrink-0 whitespace-nowrap">
            <span>{{ 'adminImportExport.sections.warehouseInventory' | translate }}</span>
          </button>
        </nav>
      </div>
    </app-card>

    <!-- Assets Section -->
    @if (activeSection() === 'assets') {
    <div class="mt-6">
      <app-assets-import-export [activeTab]="activeAssetTab()">
      </app-assets-import-export>
    </div>
    }

    <!-- Inventory Summary Section -->
    @if (activeSection() === 'inventory-summary') {
    <div class="mt-6">
      <app-admin-inventory-summary>
      </app-admin-inventory-summary>
    </div>
    }

    <!-- Warehouse Inventory Section -->
    @if (activeSection() === 'warehouse-inventory') {
    <div class="mt-6">
      <app-warehouse-inventory>
      </app-warehouse-inventory>
    </div>
    }
  </div>
</div>
