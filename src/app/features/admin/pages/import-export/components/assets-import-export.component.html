<!-- Asset Type Tabs (Ammunition, Explosive, Weapon) -->
<app-card [shadow]="true" class="mb-6 overflow-hidden min-w-0">
  <div class="asset-tabs-scroll bg-gradient-to-r from-[var(--color-background)] to-[var(--color-background-hover)]">
    <nav class="flex gap-1 p-2 w-max min-w-full" aria-label="Asset type tabs">
      <button (click)="switchTab('ammunition')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-lg scale-105': currentTab === 'ammunition',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': currentTab !== 'ammunition'
      }"
        class="asset-tab flex-shrink-0 whitespace-nowrap px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
        {{ 'warehouseInventory.tabs.ammunition' | translate }}
      </button>
      <button (click)="switchTab('explosive')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-lg scale-105': currentTab === 'explosive',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': currentTab !== 'explosive'
      }"
        class="asset-tab flex-shrink-0 whitespace-nowrap px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
        {{ 'warehouseInventory.tabs.explosive' | translate }}
      </button>
      <button (click)="switchTab('weapon')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-lg scale-105': currentTab === 'weapon',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)]': currentTab !== 'weapon'
      }"
        class="asset-tab flex-shrink-0 whitespace-nowrap px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg font-semibold text-sm transition-all duration-200 ease-in-out transform hover:scale-102">
        {{ 'warehouseInventory.tabs.weapon' | translate }}
      </button>
    </nav>
  </div>
</app-card>

<!-- Actions -->
<div class="mt-6">
  <app-card [shadow]="true">
    <div class="p-4 sm:p-6">
    <div class="flex items-center gap-3 sm:gap-4 flex-wrap">
      <button (click)="onImportClick()"
        class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="Download" class="w-4 h-4"></lucide-angular>
        <span>{{ 'common.import' | translate }}</span>
      </button>
      <button (click)="downloadTemplate()"
        class="flex items-center gap-2 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors shadow-sm"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="FileText" class="w-4 h-4"></lucide-angular>
        <span>{{ 'adminImportExport.downloadTemplate' | translate }}</span>
      </button>
      <button (click)="exportToExcel()" [disabled]="loadingAssets"
        class="flex items-center gap-2 px-4 py-2 bg-[var(--color-success)] text-white rounded-lg hover:opacity-90 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="Upload" class="w-4 h-4"></lucide-angular>
        <span>{{ 'common.exportToExcel' | translate }}</span>
      </button>
    </div>
    <p class="mt-4 text-sm text-[var(--color-text-muted)]">
      {{ 'adminImportExport.assetsDescription' | translate }}
    </p>
    </div>
  </app-card>
</div>

<!-- List Loading State (only when reloading the table; the import loader handles import/preview phases). -->
<app-loading-state *ngIf="loadingAssets && !isImportLoaderOpen" size="lg" [fullPage]="false" containerClass="text-center py-12">
</app-loading-state>

<!-- Assets Info -->
<div class="mt-6">
  <app-card *ngIf="!loadingAssets" [shadow]="true">
    <div class="p-4 sm:p-6">
    <p class="text-sm text-[var(--color-text-muted)]">
      {{ 'adminImportExport.totalItems' | translate }}: <strong class="text-[var(--color-text)]">{{
        filteredAssets.length }}</strong>
    </p>
    </div>
  </app-card>
</div>

<!-- Import Dialog -->
<app-import-dialog [isOpen]="showImportModal" [entityName]="currentTab" (close)="closeImportModal()"
  (preview)="onImportPreview($event)" (import)="onImportConfirmed($event)" (downloadTemplate)="downloadTemplate()">
</app-import-dialog>

<!-- Import Preview Dialog -->
<app-import-preview-dialog *ngIf="showPreviewModal && previewData" [previewData]="previewData" [assetType]="currentTab"
  (confirm)="onPreviewConfirmed($event)" (importCancelled)="onPreviewCancelled()">
</app-import-preview-dialog>

<!-- Import Progress Loader (shown while preview/import is running on the server). -->
<app-import-progress-loader
  [isOpen]="isImportLoaderOpen"
  [phase]="importLoaderPhase"
  [entityName]="importLoaderEntityName"
  [itemCount]="importLoaderItemCount"
  [fileName]="importLoaderFileName"
  [isRTL]="isRTL">
</app-import-progress-loader>
