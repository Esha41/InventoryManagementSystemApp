<!-- Table Selection -->
<app-card>
  <div>
    <label class="block text-sm font-semibold text-[var(--color-text)] mb-3">
      {{ 'lookupManagement.selectTable' | translate }}
    </label>
    <!-- Shared Dropdown Component -->
    <app-dropdown [options]="lookupTables" optionLabel="displayNameKey"
      [placeholder]="'lookupManagement.selectTablePlaceholder' | translate" [(ngModel)]="selectedTable"
      (selectionChange)="onTableSelect($event)" [disabled]="isLoading" [translateLabels]="true">
    </app-dropdown>
  </div>
</app-card>

<!-- Search -->
<div *ngIf="selectedTable" class="flex gap-4 mt-4 sm:mt-6">
  <div class="app-search-field flex-1">
    <lucide-angular [img]="Search" class="app-search-field__icon"></lucide-angular>
    <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
      [placeholder]="'lookupManagement.searchPlaceholder' | translate"
      class="app-search-field__input-ps w-full pe-3 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:ring-2 focus:ring-[var(--color-brand)] focus:border-[var(--color-brand)] outline-none transition-all hover:border-[var(--color-brand)]/50" />
  </div>
</div>
