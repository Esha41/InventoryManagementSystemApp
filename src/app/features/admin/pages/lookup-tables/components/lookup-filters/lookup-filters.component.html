<!-- Table Selection -->
<app-card>
  <div class="p-6">
    <label class="block text-sm font-semibold text-[var(--color-text)] mb-3">
      {{ 'lookupManagement.selectTable' | translate }}
    </label>
    <!-- Shared Dropdown Component -->
    <app-dropdown [options]="lookupTables" optionLabel="displayName"
      [placeholder]="'lookupManagement.selectTablePlaceholder' | translate" [(ngModel)]="selectedTable"
      (selectionChange)="onTableSelect($event)" [disabled]="isLoading">
    </app-dropdown>
  </div>
</app-card>

<!-- Search -->
<div *ngIf="selectedTable" class="flex gap-4 mb-6">
  <div class="relative flex-1">
    <lucide-angular [img]="Search"
      class="absolute start-3 top-1/2 -translate-y-1/2 h-4 w-4 text-[var(--color-text-muted)]"></lucide-angular>
    <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
      [placeholder]="'lookupManagement.searchPlaceholder' | translate"
      class="w-full ps-10 pe-3 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:ring-2 focus:ring-[var(--color-brand)] focus:border-[var(--color-brand)] outline-none transition-all hover:border-[var(--color-brand)]/50" />
  </div>
</div>
