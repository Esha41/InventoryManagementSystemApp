<div class="page-wrapper mx-auto min-h-full max-w-[1400px]">
  <div class="page-container py-4 sm:py-6">
    <div class="mb-5 rounded-xl border border-[var(--color-border)] bg-[var(--color-background)] px-5 py-4 shadow-sm">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div class="flex items-start gap-3">
          <div class="flex items-center justify-center rounded-lg bg-[var(--color-background-soft)] p-2 text-[var(--color-brand)]">
            <lucide-angular [img]="BookOpen" class="h-6 w-6"></lucide-angular>
          </div>
          <div>
            <h1 class="m-0 text-2xl font-bold text-[var(--color-text)]">{{ 'helpCenter.adminTitle' | translate }}</h1>
            <p class="mt-1 text-sm text-[var(--color-text-muted)]">{{ 'helpCenter.adminSubtitle' | translate }}</p>
          </div>
        </div>
      </div>
    </div>

    <div
      class="mb-6 inline-flex flex-wrap gap-1 rounded-[0.625rem] border border-[var(--color-border)] bg-[var(--color-background-soft)] p-1"
      role="tablist"
      aria-label="Help center admin">
      <button
        type="button"
        role="tab"
        [class]="tabClasses(activeTab() === 'articles')"
        [attr.aria-selected]="activeTab() === 'articles'"
        (click)="setTab('articles')">
        <lucide-angular [img]="BookOpen" class="h-4 w-4 shrink-0"></lucide-angular>
        {{ 'helpCenter.tabArticlesAdmin' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        [class]="tabClasses(activeTab() === 'messages')"
        [attr.aria-selected]="activeTab() === 'messages'"
        (click)="setTab('messages')">
        <lucide-angular [img]="Inbox" class="h-4 w-4 shrink-0"></lucide-angular>
        {{ 'helpCenter.tabMessages' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        [class]="tabClasses(activeTab() === 'terms')"
        [attr.aria-selected]="activeTab() === 'terms'"
        (click)="setTab('terms')">
        <lucide-angular [img]="FileText" class="h-4 w-4 shrink-0"></lucide-angular>
        {{ 'helpCenter.tabTermsAdmin' | translate }}
      </button>
    </div>

    <app-help-center-articles-tab *ngIf="activeTab() === 'articles'"></app-help-center-articles-tab>
    <app-help-center-messages-tab *ngIf="activeTab() === 'messages'"></app-help-center-messages-tab>
    <app-help-center-terms-tab *ngIf="activeTab() === 'terms'"></app-help-center-terms-tab>
  </div>
</div>
