<div class="admin-dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="header-content">
            <div class="title-section">
                <h1 class="dashboard-title">{{ 'nav.analytics' | translate }}</h1>
            </div>

            <div class="header-actions">
                <button class="refresh-button w-full sm:w-auto justify-center" (click)="onRefresh()"
                    [disabled]="isRefreshing()" [attr.aria-label]="'adminDashboard.refresh' | translate">
                    <lucide-icon [img]="RefreshCw" [class.spinning]="isRefreshing()" class="refresh-icon">
                    </lucide-icon>
                    <span>{{ 'adminDashboard.refresh' | translate }}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    @if (isLoading()) {
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">{{ 'adminDashboard.loading' | translate }}</p>
    </div>
    }

    <!-- Dashboard Content -->
    @if (!isLoading()) {
    <div class="dashboard-content">

        <!-- Overview Section -->
        <div class="space-y-6">
            <!-- KPI Cards Grid -->
            <div class="kpi-grid">
                <!-- Inventory Overview Card -->
                <app-inventory-overview-card *ngIf="inventoryMetrics()" [metrics]="inventoryMetrics()!"
                    class="kpi-card">
                </app-inventory-overview-card>

                <!-- Request Metrics Card -->
                <app-request-metrics-card *ngIf="requestMetrics()" [metrics]="requestMetrics()!" class="kpi-card">
                </app-request-metrics-card>
            </div>

            <!-- Charts Section -->
            <div class="charts-section">
                <div class="section-header">
                    <lucide-icon [img]="TrendingUp" class="section-icon"></lucide-icon>
                    <h2 class="section-title">{{ 'nav.analytics' | translate }}</h2>
                </div>

                <div class="charts-grid">
                    <div class="chart-item chart-wide">
                        <app-request-trends-chart period="weekly"></app-request-trends-chart>
                    </div>
                    <div class="chart-item">
                        <app-inventory-distribution-chart></app-inventory-distribution-chart>
                    </div>
                    <div class="chart-item">
                        <app-top-requested-items-chart></app-top-requested-items-chart>
                    </div>
                </div>
            </div>
        </div>

    </div>
    }
</div>
