<div class="chart-container">
    <div class="chart-header">
        <div class="header-info">
            <h3 class="chart-title">{{ 'adminDashboard.charts.requestTrends' | translate }}</h3>
            <p class="chart-subtitle">{{ 'adminDashboard.charts.' + period + 'Activity' | translate }}</p>
        </div>
        <div class="chart-actions">
            <div class="period-selector">
                <button [class.active]="period === 'weekly'" (click)="setPeriod('weekly')">
                    {{ 'adminDashboard.charts.weekly' | translate }}
                </button>
                <button [class.active]="period === 'monthly'" (click)="setPeriod('monthly')">
                    {{ 'adminDashboard.charts.monthly' | translate }}
                </button>
                <button [class.active]="period === 'yearly'" (click)="setPeriod('yearly')">
                    {{ 'adminDashboard.charts.yearly' | translate }}
                </button>
            </div>
            <button class="action-btn" (click)="loadData()" [class.spinning]="loading"
                [title]="'adminDashboard.refresh' | translate">
                <lucide-icon [img]="RefreshCw" class="icon-sm"></lucide-icon>
            </button>
        </div>
    </div>

    <div class="chart-body" [class.loading]="loading">
        <div *ngIf="loading" class="chart-loader">
            <div class="spinner"></div>
            <span>{{ 'adminDashboard.charts.analyzingTrends' | translate }}</span>
        </div>

        <div *ngIf="error" class="chart-error">
            <lucide-icon [img]="AlertCircle" class="error-icon"></lucide-icon>
            <span>{{ 'adminDashboard.charts.failedToLoad' | translate }}</span>
            <button (click)="loadData()" class="retry-btn">{{ 'adminDashboard.charts.retry' | translate }}</button>
        </div>

        <div echarts [options]="chartOptions" class="echarts-graph" *ngIf="!loading && !error"></div>
    </div>
</div>
