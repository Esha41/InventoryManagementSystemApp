<div class="announcement-form-container p-6">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-[var(--color-text)]">
                {{ (isEditMode() ? 'announcements.edit' : 'announcements.create') | translate }}
            </h1>
        </div>

        <!-- Loading State -->
        <div *ngIf="loading()" class="flex flex-col items-center justify-center py-16 gap-4">
            <div class="w-12 h-12 border-2 border-[var(--color-brand)] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-[var(--color-text-muted)]">{{ 'common.loading' | translate }}</p>
        </div>

        <!-- Form -->
        <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="onSubmit()"
            class="bg-[var(--color-background)] rounded-xl border border-[var(--color-border)] shadow-sm p-6">
            <!-- Message -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
                    {{ 'announcements.message' | translate }} <span class="text-[var(--color-error)]">*</span>
                </label>
                <textarea formControlName="message" rows="3"
                    class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all bg-[var(--color-background)] text-[var(--color-text)]"
                    [class.border-[var(--color-error)]]="form.get('message')?.invalid && form.get('message')?.touched">
                </textarea>
                <div class="text-xs text-[var(--color-text-muted)] mt-1">
                    {{ form.get('message')?.value?.length || 0 }} / 500
                </div>
                <div *ngIf="form.get('message')?.invalid && form.get('message')?.touched"
                    class="text-sm mt-1 text-[var(--color-error)]">
                    {{ 'validation.required' | translate }}
                </div>
            </div>

            <!-- Priority -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
                    {{ 'announcements.priority' | translate }} <span class="text-[var(--color-error)]">*</span>
                </label>
                <app-dropdown class="w-full" formControlName="priority" [options]="priorities"
                    optionValue="value" [optionLabelFn]="getPriorityOptionLabel"
                    [placeholder]="'announcements.priority' | translate"
                    [error]="!!(form.get('priority')?.invalid && form.get('priority')?.touched)"
                    [noDataText]="'common.noData' | translate">
                </app-dropdown>
            </div>

            <!-- Dismissable -->
            <div class="mb-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" formControlName="isDismissable"
                        class="h-4 w-4 rounded border-2 border-[var(--color-border)] text-[var(--color-brand)] focus:ring-2 focus:ring-[var(--color-brand)]/20 cursor-pointer">
                    <span class="text-sm font-medium text-[var(--color-text)]">
                        {{ 'announcements.dismissable' | translate }}
                    </span>
                </label>
            </div>

            <!-- Date Range -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
                        {{ 'announcements.startDate' | translate }} <span class="text-[var(--color-error)]">*</span>
                    </label>
                    <input type="date" formControlName="startDate"
                        class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all bg-[var(--color-background)] text-[var(--color-text)] cursor-pointer"
                        [class.border-[var(--color-error)]]="form.get('startDate')?.invalid && form.get('startDate')?.touched">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
                        {{ 'announcements.endDate' | translate }}
                    </label>
                    <input type="date" formControlName="endDate"
                        class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all bg-[var(--color-background)] text-[var(--color-text)] cursor-pointer">
                </div>
            </div>

            <!-- Target Roles -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
                    {{ 'announcements.targetRoles' | translate }}
                </label>
                <p class="text-xs text-[var(--color-text-muted)] mb-2 cursor-help"
                    [title]="'announcements.targetRolesHint' | translate">
                    {{ 'announcements.targetRolesHelp' | translate }}
                </p>
                <app-dropdown class="w-full" formControlName="targetRoles" [options]="roles()"
                    optionValue="id" optionLabel="name" [multiple]="true" [placeholderSelectable]="true"
                    [placeholderValue]="null"
                    [error]="!!(form.get('targetRoles')?.invalid && form.get('targetRoles')?.touched)"
                    [placeholder]="'announcements.allRoles' | translate"
                    [noDataText]="'common.noData' | translate">
                </app-dropdown>
            </div>

            <!-- Active Status -->
            <div class="mb-6">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" formControlName="isActive"
                        class="h-4 w-4 rounded border-2 border-[var(--color-border)] text-[var(--color-brand)] focus:ring-2 focus:ring-[var(--color-brand)]/20 cursor-pointer">
                    <span class="text-sm font-medium text-[var(--color-text)]">
                        {{ 'announcements.active' | translate }}
                    </span>
                </label>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" (click)="cancel()"
                    class="px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg text-[var(--color-text)] hover:bg-[var(--color-background-hover)] transition-all font-medium disabled:opacity-60 disabled:cursor-not-allowed"
                    [disabled]="submitting()">
                    {{ 'common.cancel' | translate }}
                </button>
                <button type="submit"
                    class="px-4 py-2.5 bg-[var(--color-brand)] text-white rounded-lg hover:bg-[var(--color-brand-dark)] font-semibold transition-all disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)]/50"
                    [disabled]="submitting() || form.invalid">
                    <span *ngIf="submitting()" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2 align-middle"></span>
                    {{ 'common.save' | translate }}
                </button>
            </div>
        </form>
    </div>
</div>
