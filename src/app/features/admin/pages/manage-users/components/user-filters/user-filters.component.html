<div class="mb-6 flex flex-wrap items-center gap-3 max-md:flex-col max-md:items-stretch">
  <!-- Search: global app-search-field* (tokens in styles.css) -->
  <div class="app-search-field shrink flex-[1.5] basis-[min(100%,22rem)]">
    <lucide-angular [img]="Search" class="app-search-field__icon"></lucide-angular>
    <input
      type="text"
      inputmode="search"
      enterkeyhint="search"
      name="userAdminSearch"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      (keyup.enter)="onSearchClick()"
      [placeholder]="'manageAdmins.searchPlaceholder' | translate"
      [ngClass]="searchInputPaddingEndClass"
      class="app-search-field__input-surface app-search-field__input-ps" />
    <div *ngIf="useSearchButton" class="app-search-field__actions">
      <button
        *ngIf="showSearchClear"
        type="button"
        (click)="onClearSearch($event)"
        class="shrink-0 rounded-md p-1 text-[var(--color-error)] transition-colors hover:opacity-80"
        [attr.aria-label]="'common.clear' | translate"
        [title]="'common.clear' | translate">
        <lucide-angular [img]="X" class="h-4 w-4"></lucide-angular>
      </button>
      <button
        type="button"
        (click)="onSearchClick()"
        class="shrink-0 whitespace-nowrap rounded-md bg-[var(--color-brand)] px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-white shadow-soft transition-all hover:bg-[var(--color-brand-hover)] active:scale-95">
        {{ 'common.search' | translate }}
      </button>
    </div>
    <button
      *ngIf="!useSearchButton && showSearchClear"
      type="button"
      (click)="onClearSearch($event)"
      class="app-search-field__actions rounded-md p-1 text-[var(--color-error)] transition-colors hover:opacity-80"
      [attr.aria-label]="'common.clear' | translate"
      [title]="'common.clear' | translate">
      <lucide-angular [img]="X" class="h-4 w-4"></lucide-angular>
    </button>
  </div>

  <!-- Rank Filter -->
  <div class="relative w-[200px] max-md:w-full">
      <app-dropdown
        class="w-full"
        [(ngModel)]="rankFilterId"
        (selectionChange)="onRankFilterChange($event)"
        [options]="ranks"
        optionValue="id"
        [optionLabelFn]="rankOptionLabel"
        [placeholderSelectable]="false"
        [placeholderValue]="null"
        placeholder="{{ 'userFormModal.rankPlaceholder' | translate }}">
      </app-dropdown>

      <button
        *ngIf="rankFilterId !== null && rankFilterId !== undefined"
        type="button"
        (click)="clearRankFilter($event)"
        class="pointer-events-auto absolute end-8 top-1/2 z-20 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-md border-2 border-[var(--color-border)] bg-[var(--color-background)] text-[var(--color-text-muted)] shadow-custom-sm transition-colors hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] active:bg-[var(--color-background-active)]"
        [attr.aria-label]="'allowance.clearFilter' | translate"
        title="{{ 'allowance.clearFilter' | translate }}">
        <lucide-angular [img]="X" class="h-3.5 w-3.5"></lucide-angular>
      </button>
  </div>

  <!-- Department Filter -->
  <div class="relative w-[200px] max-md:w-full">
      <app-dropdown
        class="w-full"
        [(ngModel)]="departmentFilterId"
        (selectionChange)="onDepartmentFilterChange($event)"
        [options]="departments"
        optionValue="id"
        [optionLabelFn]="departmentOptionLabel"
        [placeholderSelectable]="false"
        [placeholderValue]="null"
        placeholder="{{ 'userFormModal.departmentPlaceholder' | translate }}">
      </app-dropdown>

      <button
        *ngIf="departmentFilterId !== null && departmentFilterId !== undefined"
        type="button"
        (click)="clearDepartmentFilter($event)"
        class="pointer-events-auto absolute end-8 top-1/2 z-20 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-md border-2 border-[var(--color-border)] bg-[var(--color-background)] text-[var(--color-text-muted)] shadow-custom-sm transition-colors hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] active:bg-[var(--color-background-active)]"
        [attr.aria-label]="'allowance.clearFilter' | translate"
        title="{{ 'allowance.clearFilter' | translate }}">
        <lucide-angular [img]="X" class="h-3.5 w-3.5"></lucide-angular>
      </button>
  </div>

  <!-- Roles Filter -->
  <div class="relative w-[220px] max-md:w-full">
      <app-dropdown
        class="w-full"
        [(ngModel)]="roleFilterId"
        (selectionChange)="onRoleFilterChange($event)"
        [options]="roles"
        optionValue="id"
        [optionLabelFn]="roleOptionLabel"
        [placeholderSelectable]="false"
        [placeholderValue]="null"
        placeholder="{{ 'userFormModal.rolesPlaceholder' | translate }}">
      </app-dropdown>

      <button
        *ngIf="roleFilterId !== null && roleFilterId !== undefined"
        type="button"
        (click)="clearRoleFilter($event)"
        class="pointer-events-auto absolute end-8 top-1/2 z-20 flex h-5 w-5 -translate-y-1/2 items-center justify-center rounded-md border-2 border-[var(--color-border)] bg-[var(--color-background)] text-[var(--color-text-muted)] shadow-custom-sm transition-colors hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] active:bg-[var(--color-background-active)]"
        [attr.aria-label]="'allowance.clearFilter' | translate"
        title="{{ 'allowance.clearFilter' | translate }}">
        <lucide-angular [img]="X" class="h-3.5 w-3.5"></lucide-angular>
      </button>
  </div>

  <!-- Status Filter Group -->
  <div class="flex items-center gap-3 max-md:flex-col max-md:items-start">
    <span class="text-sm font-semibold text-[var(--color-text-muted)]">{{ 'manageAdmins.status' | translate }}:</span>
    <div
      class="flex rounded-[0.85rem] border border-[var(--color-border)] bg-[var(--color-background)] p-1 shadow-[var(--shadow-sm)] max-md:w-full">
      <button
        (click)="onStatusFilterChange('all')"
        type="button"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-[0.65rem] border border-transparent px-4 py-2 text-sm font-semibold text-[var(--color-text-muted)] transition-all hover:bg-[var(--color-background-muted)] hover:text-[var(--color-text)] max-md:flex-1 max-md:justify-center"
        [ngClass]="
          statusFilter === 'all'
            ? '-translate-y-px bg-[var(--color-brand)] text-white shadow-md border-[var(--color-brand-dark)]'
            : ''
        ">
        {{ 'manageAdmins.allUsers' | translate }}
      </button>

      <button
        (click)="onStatusFilterChange('active')"
        type="button"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-[0.65rem] border border-transparent px-4 py-2 text-sm font-semibold text-[var(--color-text-muted)] transition-all hover:bg-[var(--color-background-muted)] hover:text-[var(--color-text)] max-md:flex-1 max-md:justify-center"
        [ngClass]="
          statusFilter === 'active'
            ? '-translate-y-px bg-[var(--color-success)] text-white shadow-md [border-color:color-mix(in_srgb,var(--color-success)_80%,black)]'
            : ''
        ">
        <div
          class="h-2.5 w-2.5 rounded-full border-2 border-white"
          [ngClass]="statusFilter === 'active' ? 'bg-white' : 'bg-[var(--color-success)]'"></div>
        {{ 'manageAdmins.active' | translate }}
      </button>

      <button
        (click)="onStatusFilterChange('inactive')"
        type="button"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-[0.65rem] border border-transparent px-4 py-2 text-sm font-semibold text-[var(--color-text-muted)] transition-all hover:bg-[var(--color-background-muted)] hover:text-[var(--color-text)] max-md:flex-1 max-md:justify-center"
        [ngClass]="
          statusFilter === 'inactive'
            ? '-translate-y-px bg-[var(--color-warning)] text-white shadow-md [border-color:color-mix(in_srgb,var(--color-warning)_80%,black)]'
            : ''
        ">
        <div
          class="h-2.5 w-2.5 rounded-full border-2 border-white"
          [ngClass]="statusFilter === 'inactive' ? 'bg-white' : 'bg-[var(--color-warning)]'"></div>
        {{ 'manageAdmins.inactive' | translate }}
      </button>

      <button
        (click)="onStatusFilterChange('deleted')"
        type="button"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-[0.65rem] border border-transparent px-4 py-2 text-sm font-semibold text-[var(--color-text-muted)] transition-all hover:bg-[var(--color-background-muted)] hover:text-[var(--color-text)] max-md:flex-1 max-md:justify-center"
        [ngClass]="
          statusFilter === 'deleted'
            ? '-translate-y-px bg-[var(--color-error)] text-white shadow-md [border-color:color-mix(in_srgb,var(--color-error)_80%,black)]'
            : ''
        ">
        <div
          class="h-2.5 w-2.5 rounded-full border-2 border-white"
          [ngClass]="statusFilter === 'deleted' ? 'bg-white' : 'bg-[var(--color-error)]'"></div>
        {{ 'manageAdmins.deleted' | translate }}
      </button>
    </div>
  </div>
</div>
