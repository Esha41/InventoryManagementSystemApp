<div class="filter-container mb-6">
  <!-- Search -->
  <div class="search-wrapper">
    <lucide-angular [img]="Search" class="search-icon"></lucide-angular>
    <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
      [placeholder]="'manageAdmins.searchPlaceholder' | translate" class="search-input" />
  </div>

  <!-- Status Filter Group -->
  <div class="filter-group">
    <span class="filter-label text-[var(--color-text-muted)] text-sm font-medium">{{ 'manageAdmins.status' | translate
      }}:</span>
    <div class="filter-options">
      <button (click)="onStatusFilterChange('all')" [class.active]="statusFilter === 'all'" class="filter-btn all">
        {{ 'manageAdmins.allUsers' | translate }}
      </button>

      <button (click)="onStatusFilterChange('active')" [class.active]="statusFilter === 'active'"
        class="filter-btn active">
        <div class="status-dot bg-[var(--color-success)]"></div>
        {{ 'manageAdmins.active' | translate }}
      </button>

      <button (click)="onStatusFilterChange('inactive')" [class.active]="statusFilter === 'inactive'"
        class="filter-btn inactive">
        <div class="status-dot bg-[var(--color-error)]"></div>
        {{ 'manageAdmins.inactive' | translate }}
      </button>
    </div>
  </div>
</div>
