<div
  class="rqn-config-modal__backdrop fixed inset-0 z-[100] flex items-center justify-center p-4 overflow-y-auto overflow-x-hidden"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'rqn-config-modal-title'">
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="!saving && dismiss()" tabindex="-1"></div>

  <div
    class="relative z-10 w-full max-w-lg rounded-xl border-2 border-[var(--color-border)] bg-[var(--color-background)] shadow-custom-lg max-h-[min(90vh,720px)] flex flex-col"
    (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-[var(--color-border)] shrink-0">
      <div class="min-w-0">
        <h2 id="rqn-config-modal-title" class="text-lg font-semibold text-[var(--color-text)]">
          {{ 'workflow.requesterQtyNotifyModalTitle' | translate : { name: resolvedWorkflowTitle } }}
        </h2>
        <p *ngIf="resolvedWorkflowType" class="mt-1 text-sm text-[var(--color-text-muted)]">
          {{ resolvedWorkflowType }}
        </p>
      </div>
      <button
        type="button"
        class="shrink-0 p-2 rounded-lg hover:bg-[var(--color-background-hover)] text-[var(--color-text-muted)] disabled:opacity-40"
        [disabled]="saving"
        (click)="dismiss()"
        [attr.aria-label]="'common.close' | translate">
        <lucide-angular [img]="X" class="h-5 w-5"></lucide-angular>
      </button>
    </div>

    <div class="rqn-config-modal__body px-5 py-4 overflow-y-auto overflow-x-hidden flex-1 min-h-0 space-y-4">
      <div *ngIf="loading" class="py-12 flex flex-col items-center justify-center gap-3 text-sm text-[var(--color-text-muted)]">
        <lucide-angular [img]="Loader2" class="h-8 w-8 animate-spin text-[var(--color-brand)]"></lucide-angular>
        <span>{{ 'common.loading' | translate }}</span>
      </div>

      <div
        *ngIf="!loading && loadFailed"
        class="rounded-lg border border-[var(--color-error)]/30 bg-[var(--color-error)]/10 px-4 py-3 text-sm text-[var(--color-error)]">
        {{ loadFailed }}
      </div>

      <ng-container *ngIf="!loading && !loadFailed && workflowDetail">
        <div class="space-y-1 w-full min-w-0 rounded-lg border border-[var(--color-border)]/80 p-3 bg-[var(--color-background)]">
          <span class="block text-sm font-medium text-[var(--color-text)]">
            {{ 'workflow.requesterQtyNotifyStepsFieldLabel' | translate }}
          </span>         
          <app-dropdown
            class="block w-full min-w-0"
            [(ngModel)]="selectedStepIds"
            name="requesterQtyNotifySteps"
            [options]="stepDropdownOptions"
            [multiple]="true"
            [showSearch]="true"
            [disabled]="!stepDropdownOptions.length || saving"
            [noDataText]="'common.noData' | translate"
            [placeholder]="'workflow.requesterQtyNotifyStepsPlaceholder' | translate">
          </app-dropdown>
        </div>

        <div
          *ngIf="saveError"
          class="rounded-lg border border-[var(--color-error)]/30 bg-[var(--color-error)]/10 px-4 py-3 text-sm text-[var(--color-error)]"
          role="alert">
          {{ saveError }}
        </div>
      </ng-container>
    </div>

    <div
      class="flex items-center justify-end gap-3 px-5 py-4 border-t border-[var(--color-border)] shrink-0 bg-[var(--color-background-muted)]/30">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium rounded-lg border-2 border-[var(--color-border)] text-[var(--color-text)] hover:bg-[var(--color-background-hover)] disabled:opacity-50"
        [disabled]="saving || loading || !!loadFailed"
        (click)="dismiss()">
        {{ 'common.cancel' | translate }}
      </button>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 min-w-[7rem] px-4 py-2 text-sm font-medium rounded-lg bg-[var(--color-brand)] text-white hover:bg-[var(--color-brand-dark)] disabled:opacity-50"
        [disabled]="saveDisabled"
        (click)="save()">
        <lucide-angular *ngIf="saving" [img]="Loader2" class="h-4 w-4 shrink-0 animate-spin"></lucide-angular>
        <span>{{ saving ? ('common.saving' | translate) : ('common.save' | translate) }}</span>
      </button>
    </div>
  </div>
</div>
