<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold text-[var(--color-text)]">{{ 'assetList.title' | translate }}</h1>
  </div>
  <div *ngIf="showAddButton"
    class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-2 w-full sm:w-auto sm:justify-end">
      <button type="button" *appHasPermission="assetExportPerms" appPermissionMode="any" (click)="onExportClick()"
        class="flex items-center justify-center gap-2 px-4 py-2.5 min-h-[2.75rem] rounded-lg text-white bg-[var(--color-success)] hover:opacity-90 transition-colors shadow-sm text-sm font-medium whitespace-nowrap"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="Upload" class="w-4 h-4 flex-shrink-0"></lucide-angular>
        <span>{{ 'common.exportToExcel' | translate }}</span>
      </button>
      <button type="button" *appHasPermission="assetCreatePerms" appPermissionMode="any" (click)="onImportClick()"
        class="flex items-center justify-center gap-2 px-4 py-2.5 min-h-[2.75rem] rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm text-sm font-medium whitespace-nowrap"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="Download" class="w-4 h-4 flex-shrink-0"></lucide-angular>
        <span>{{ 'common.import' | translate }}</span>
      </button>
      <button type="button" *appHasPermission="assetCreatePerms" appPermissionMode="any" (click)="onTemplateClick()"
        class="flex items-center justify-center gap-2 px-4 py-2.5 min-h-[2.75rem] rounded-lg text-white bg-gray-600 hover:bg-gray-700 transition-colors shadow-sm text-sm font-medium whitespace-nowrap"
        [class.flex-row-reverse]="isRTL">
        <lucide-angular [img]="FileText" class="w-4 h-4 flex-shrink-0"></lucide-angular>
        <span>{{ 'common.downloadTemplate' | translate }}</span>
      </button>
      <app-button *appHasPermission="assetCreatePerms" appPermissionMode="any" variant="primary" (click)="onAddClick()"
        class="w-full sm:w-auto shrink-0">
        <span class="flex items-center gap-2 justify-center" [class.flex-row-reverse]="isRTL">
          <lucide-angular [img]="Plus" class="h-4 w-4 flex-shrink-0"></lucide-angular>
          <span *ngIf="activeTab === 'ammunition'">{{ 'assetList.addAmmunition' | translate }}</span>
          <span *ngIf="activeTab === 'weapon'">{{ 'assetList.addWeapon' | translate }}</span>
          <span *ngIf="activeTab === 'explosive'">{{ 'assetList.addExplosive' | translate }}</span>
        </span>
      </app-button>
  </div>
</div>

<app-card [shadow]="true" class="min-w-0 mb-6">
  <div class="asset-tabs-scroll overflow-x-auto overflow-y-hidden scrollbar-hide bg-gradient-to-r from-[var(--color-background)] to-[var(--color-background-hover)]">
    <nav class="asset-tabs flex gap-2 p-2 w-max min-w-full" aria-label="Tabs">
      <button type="button" *appHasPermission="tabPermsAmmunition" appPermissionMode="any" (click)="onTabClick('ammunition')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'ammunition',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'ammunition'
      }"
        class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
      >
        <span>{{ 'assetList.tabs.ammunition' | translate }}</span>
      </button>
      <button type="button" *appHasPermission="tabPermsExplosive" appPermissionMode="any" (click)="onTabClick('explosive')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'explosive',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'explosive'
      }"
        class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
      >
        <span>{{ 'assetList.tabs.explosive' | translate }}</span>
      </button>
      <button type="button" *appHasPermission="tabPermsWeapon" appPermissionMode="any" (click)="onTabClick('weapon')" [ngClass]="{
        'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'weapon',
        'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'weapon'
      }"
        class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
      >
        <span>{{ 'assetList.tabs.weapon' | translate }}</span>
      </button>
    </nav>
  </div>
</app-card>
