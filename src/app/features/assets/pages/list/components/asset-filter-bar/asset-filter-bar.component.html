<app-card [shadow]="true">
  <div class="p-6">
    <div class="mb-4">
      <h3 class="text-lg font-semibold text-[var(--color-text)]">{{ 'assetList.filters.title' | translate }}</h3>
    </div>
    <div class="flex flex-wrap items-end gap-4">
      <!-- Search -->
      <div class="relative flex-1 min-w-0 w-full sm:min-w-[200px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.search' | translate }}
        </label>
        <div class="app-search-field">
          <lucide-angular [img]="Search" class="app-search-field__icon app-search-field__icon--lg"></lucide-angular>
          <input type="text" [(ngModel)]="filterState.searchTerm"
            (keyup.enter)="onSearchClick()"
            [placeholder]="(activeTab === 'weapon' ? 'assetList.searchPlaceholderWeapons' : 'assetList.searchPlaceholder') | translate"
            class="app-search-field__input-ps-lg w-full pe-24 py-2.5 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm text-[var(--color-text)] placeholder-[var(--color-text-muted)] focus:ring-2 focus:ring-[var(--color-brand)] focus:border-[var(--color-brand)] focus:bg-[var(--color-background)] outline-none transition-all" />
          <div class="absolute inset-y-0 end-0 pe-2 flex items-center gap-1">
            <button *ngIf="filterState.searchTerm" (click)="clearSearch()"
              class="p-1 text-[var(--color-text-muted)] hover:text-[var(--color-error)] transition-colors">
              <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
            </button>
            <button (click)="onSearchClick()"
              class="px-3 py-1 bg-[var(--color-brand)] text-white text-[10px] font-bold uppercase tracking-wider rounded-md hover:bg-[var(--color-brand-hover)] transition-all active:scale-95 shadow-soft">
              {{ 'common.search' | translate }}
            </button>
          </div>
        </div>
      </div>

      <!-- Ammunition Filters -->
      <div *ngIf="activeTab === 'ammunition'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.caseType' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedCaseType" (selectionChange)="onFilterChange()"
          [options]="filterOptions.caseType" optionLabel="label" optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allCaseTypes' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'ammunition'" class="w-full sm:w-[220px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.primaryPurpose' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedPrimaryPurposeId"
          (selectionChange)="onFilterChange()" [options]="filterOptions.primaryPurpose" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allPrimaryPurposes' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'ammunition'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.compatibility' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedCompatibility"
          (selectionChange)="onFilterChange()" [options]="filterOptions.compatibility" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allCompatibility' | translate }}">
        </app-dropdown>
      </div>

      <!-- Weapon Filters -->
      <div *ngIf="activeTab === 'weapon'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.weaponType' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedWeaponType"
          (selectionChange)="onFilterChange()" [options]="filterOptions.weaponType" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allWeaponTypes' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'weapon'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.classification' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedWeaponClassification"
          (selectionChange)="onFilterChange()" [options]="filterOptions.weaponClassification" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allClassifications' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'weapon'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.country' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedCountryOfManufacture"
          (selectionChange)="onFilterChange()" [options]="filterOptions.countryOfManufacture" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allCountries' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'weapon'" class="w-full sm:w-[220px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.primaryPurpose' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedWeaponPrimaryPurposeId"
          (selectionChange)="onFilterChange()" [options]="filterOptions.primaryPurpose" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allPrimaryPurposes' | translate }}">
        </app-dropdown>
      </div>

      <!-- Explosive Filters -->
      <div *ngIf="activeTab === 'explosive'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.explosiveType' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedExplosiveType"
          (selectionChange)="onFilterChange()" [options]="filterOptions.explosiveType" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allExplosiveTypes' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'explosive'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.classification' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedExplosiveClassification"
          (selectionChange)="onFilterChange()" [options]="filterOptions.explosiveClassification" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allClassifications' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'explosive'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.hazardDivision' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedExplosiveHazardDivision"
          (selectionChange)="onFilterChange()" [options]="filterOptions.explosiveHazardDivision" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allHazardDivisions' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'explosive'" class="w-full sm:w-[180px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.compatibility' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedExplosiveCompatibility"
          (selectionChange)="onFilterChange()" [options]="filterOptions.explosiveCompatibility" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allCompatibility' | translate }}">
        </app-dropdown>
      </div>

      <div *ngIf="activeTab === 'explosive'" class="w-full sm:w-[220px]">
        <label class="block text-sm font-medium text-[var(--color-text)] mb-2">
          {{ 'assetList.filters.primaryPurpose' | translate }}
        </label>
        <app-dropdown class="w-full" [(ngModel)]="filterState.selectedExplosivePrimaryPurposeId"
          (selectionChange)="onFilterChange()" [options]="filterOptions.primaryPurpose" optionLabel="label"
          optionValue="value" [placeholderSelectable]="false"
          placeholder="{{ 'assetList.filters.allPrimaryPurposes' | translate }}">
        </app-dropdown>
      </div>

      <div class="w-full flex flex-wrap items-end gap-2 sm:ms-auto sm:w-auto">
        <button
          type="button"
          (click)="toggleMoreFilters()"
          [attr.aria-expanded]="showMoreFilters"
          class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border-2 border-[var(--color-border)] bg-[var(--color-background)] text-sm font-medium text-[var(--color-text)] hover:bg-[var(--color-background-hover)] transition-colors w-full sm:w-auto justify-center"
        >
          <lucide-angular
            [img]="ChevronDown"
            class="h-4 w-4 text-[var(--color-text-muted)] transition-transform duration-200 shrink-0"
            [class.rotate-180]="showMoreFilters"
          ></lucide-angular>
          <span>{{ (showMoreFilters ? 'assetList.filters.hideColumnFilters' : 'assetList.filters.moreColumnFilters') | translate }}</span>
        </button>
      </div>
    </div>

    <ng-container *ngIf="showMoreFilters">
      <div class="pt-5 mt-5 border-t border-[var(--color-border)] space-y-4">
        <p class="text-xs text-[var(--color-text-muted)]">{{ 'assetList.filters.columnFiltersHint' | translate }}</p>

        <!-- Ammunition: match table columns -->
        <div *ngIf="activeTab === 'ammunition'" class="flex flex-col gap-4">
          <div class="alf-more-filters__single-line">
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.name' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.name" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.itemNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.itemNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.partNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.partNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.caliber' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.caliber" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
          </div>
          <div class="alf-more-filters__actions-row w-full flex flex-wrap items-end gap-4">
            <div class="alf-more-filters__arm-un-line flex flex-nowrap gap-4 min-w-0 overflow-x-auto pb-0.5">
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.armNumber' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.armNumber" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.unNumber' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.unNumber" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.nsn' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.nsn" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
            </div>
            <div class="alf-more-filters__actions flex flex-wrap gap-2 w-full sm:w-auto sm:ms-auto">
              <button
                type="button"
                (click)="applyColumnFilters()"
                class="px-4 py-2 bg-[var(--color-brand)] text-white text-sm font-semibold rounded-lg hover:bg-[var(--color-brand-hover)] transition-colors"
              >
                {{ 'assetList.filters.applyColumnFilters' | translate }}
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="activeTab === 'weapon'" class="flex flex-col gap-4">
          <div class="alf-more-filters__single-line">
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.name' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.name" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.itemNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.itemNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.partNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.partNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.unNumber' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.unNumber" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.nsn' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.nsn" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
          </div>
          <div class="alf-more-filters__actions-row w-full flex flex-wrap items-end gap-4">
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.weaponType' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.weaponType" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.caliber' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.caliber" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-more-filters__actions flex flex-wrap gap-2 w-full sm:w-auto sm:ms-auto">
              <button
                type="button"
                (click)="applyColumnFilters()"
                class="px-4 py-2 bg-[var(--color-brand)] text-white text-sm font-semibold rounded-lg hover:bg-[var(--color-brand-hover)] transition-colors"
              >
                {{ 'assetList.filters.applyColumnFilters' | translate }}
              </button>
            </div>
          </div>
        </div>

        <!-- Explosives -->
        <div *ngIf="activeTab === 'explosive'" class="flex flex-col gap-4">
          <div class="alf-more-filters__single-line">
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.name' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.name" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.itemNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.itemNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
            <div class="alf-col-field alf-col-field--line">
              <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.partNo' | translate }}</label>
              <input type="text" [(ngModel)]="filterState.columnFilters.partNo" (keydown)="onColumnFilterKeydown($event)"
                class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
            </div>
          </div>
          <div class="alf-more-filters__actions-row w-full flex flex-wrap items-end gap-4">
            <div class="alf-more-filters__arm-un-line flex flex-nowrap gap-4 min-w-0 overflow-x-auto pb-0.5">
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.armNumber' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.armNumber" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'addAsset.unNumber' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.unNumber" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
              <div class="alf-col-field alf-col-field--line">
                <label class="text-xs font-medium text-[var(--color-text-muted)]">{{ 'assetList.table.nsn' | translate }}</label>
                <input type="text" [(ngModel)]="filterState.columnFilters.nsn" (keydown)="onColumnFilterKeydown($event)"
                  class="w-full py-2 px-3 border border-[var(--color-border)] rounded-lg bg-[var(--color-background)] text-sm focus:ring-2 focus:ring-[var(--color-brand)] outline-none" />
              </div>
            </div>
            <div class="alf-more-filters__actions flex flex-wrap gap-2 w-full sm:w-auto sm:ms-auto">
              <button
                type="button"
                (click)="applyColumnFilters()"
                class="px-4 py-2 bg-[var(--color-brand)] text-white text-sm font-semibold rounded-lg hover:bg-[var(--color-brand-hover)] transition-colors"
              >
                {{ 'assetList.filters.applyColumnFilters' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <div class="mt-4 flex justify-end">
      <button
        type="button"
        (click)="onClearFilters()"
        class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-[var(--color-text)] bg-[var(--color-background)] border-2 border-[var(--color-border)] rounded-lg hover:bg-[var(--color-background-hover)] transition-colors"
      >
        <lucide-angular [img]="FilterX" class="h-4 w-4 shrink-0"></lucide-angular>
        <span>{{ 'assetList.filters.clear' | translate }}</span>
      </button>
    </div>
  </div>
</app-card>
