<div class="page-wrapper">
  <div class="page-container space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[var(--color-text)]">{{ 'assetList.title' | translate }}</h1>
        <p class="text-[var(--color-text-muted)] mt-2">{{ 'assetList.subtitle' | translate }}</p>
      </div>
      <ng-container *ngIf="(activeTab !== 'ammunition' || ammunitionViewMode === 'available') && (activeTab !== 'explosive' || explosivesViewMode === 'available') && (activeTab !== 'weapon' || weaponsViewMode === 'available')">
        <app-button *appHasPermission="'Ammunition.Create'" variant="primary" (click)="navigateToAddAsset()"
          class="w-full sm:w-auto">
        <span class="flex items-center gap-2 justify-center" [class.flex-row-reverse]="isRTL">
          <lucide-angular [img]="Plus" class="h-4 w-4 flex-shrink-0"></lucide-angular>
          <span *ngIf="activeTab === 'ammunition'">{{ 'assetList.addAmmunition' | translate }}</span>
          <span *ngIf="activeTab === 'weapon'">{{ 'assetList.addWeapon' | translate }}</span>
          <span *ngIf="activeTab === 'explosive'">{{ 'assetList.addExplosive' | translate }}</span>
        </span>
        </app-button>
      </ng-container>
    </div>

    <!-- Tabs - scroll inside container when space is limited -->
    <app-card [shadow]="true" class="min-w-0 mb-6">
      <div class="asset-tabs-scroll overflow-x-auto overflow-y-hidden scrollbar-hide bg-gradient-to-r from-[var(--color-background)] to-[var(--color-background-hover)]">
        <nav class="asset-tabs flex gap-2 p-2 w-max min-w-full" aria-label="Tabs" [class.flex-row-reverse]="isRTL">
          <button (click)="switchTab('ammunition')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'ammunition',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'ammunition'
          }"
            class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
            [class.flex-row-reverse]="isRTL">
            <span>{{ 'assetList.tabs.ammunition' | translate }}</span>
          </button>
          <button (click)="switchTab('explosive')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'explosive',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'explosive'
          }"
            class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
            [class.flex-row-reverse]="isRTL">
            <span>{{ 'assetList.tabs.explosive' | translate }}</span>
          </button>
          <button (click)="switchTab('weapon')" [ngClass]="{
            'bg-[var(--color-brand)] text-white shadow-md': activeTab === 'weapon',
            'bg-[var(--color-background)] text-[var(--color-text-muted)] hover:bg-[var(--color-background-hover)] hover:text-[var(--color-text)] border-2 border-[var(--color-border)]': activeTab !== 'weapon'
          }"
            class="asset-tab flex items-center gap-2 px-3 sm:px-5 py-2.5 sm:py-3 min-h-[2.75rem] rounded-lg font-semibold text-sm transition-all duration-200 flex-shrink-0 whitespace-nowrap"
            [class.flex-row-reverse]="isRTL">
            <span>{{ 'assetList.tabs.weapon' | translate }}</span>
          </button>
        </nav>
      </div>
    </app-card>

    <!-- Filters Card -->
    <div class="mb-6">
      <app-asset-filter-bar [activeTab]="activeTab" [filterState]="filterState" [isRTL]="isRTL"
      [caseTypeFilterOptions]="caseTypeFilterOptions"
      [hazardDivisionFilterOptions]="hazardDivisionFilterOptions"
      [compatibilityFilterOptions]="compatibilityFilterOptions"
      [weaponTypeFilterOptions]="weaponTypeFilterOptions"
      [weaponClassificationFilterOptions]="weaponClassificationFilterOptions"
      [countryFilterOptions]="countryFilterOptions"
      [explosiveTypeFilterOptions]="explosiveTypeFilterOptions"
      [explosiveClassificationFilterOptions]="explosiveClassificationFilterOptions"
      [explosiveHazardDivisionFilterOptions]="explosiveHazardDivisionFilterOptions"
      [explosiveCompatibilityFilterOptions]="explosiveCompatibilityFilterOptions"
      (filterChange)="onFilterChange()" (searchTriggered)="onFilterChange()" (clearFilters)="clearFilters()">
      </app-asset-filter-bar>
    </div>

    <!-- Assets Table Card (heading + sub-tabs + table inside one card) -->
    <div class="mt-6">
      <app-asset-table [assets]="assets" [activeTab]="activeTab" [loading]="loading" [sortState]="sortState"
      [ammunitionViewMode]="ammunitionViewMode" [explosivesViewMode]="explosivesViewMode" [weaponsViewMode]="weaponsViewMode"
      [totalItems]="totalItems" [showEditDelete]="(activeTab !== 'ammunition' || ammunitionViewMode === 'available') && (activeTab !== 'explosive' || explosivesViewMode === 'available') && (activeTab !== 'weapon' || weaponsViewMode === 'available')"
      [showRestore]="(activeTab === 'ammunition' && ammunitionViewMode === 'deleted') || (activeTab === 'explosive' && explosivesViewMode === 'deleted') || (activeTab === 'weapon' && weaponsViewMode === 'deleted')"
      [showPermanentDelete]="(activeTab === 'ammunition' && ammunitionViewMode === 'deleted') || (activeTab === 'explosive' && explosivesViewMode === 'deleted') || (activeTab === 'weapon' && weaponsViewMode === 'deleted')"
      [paginationState]="paginationState" [totalPages]="totalPages" [isRTL]="isRTL" [getAssetName]="getAssetName"
      (view)="onView($event)" (edit)="onEdit($event)" (delete)="onDelete($event)" (restore)="onRestore($event)" (permanentDelete)="onPermanentDelete($event)" (sort)="sortByColumn($event)"
      (pageChange)="onPageChange($event)" (rowsPerPageChange)="onRowsPerPageChange($event)"
      (ammunitionViewModeChange)="switchAmmunitionViewMode($event)" (explosivesViewModeChange)="switchExplosivesViewMode($event)" (weaponsViewModeChange)="switchWeaponsViewMode($event)"
      (imageError)="onImageError($event)" (showImagePreview)="showImagePreview($event.event, $event.asset)"
      (hideImagePreview)="hideImagePreview()">
      </app-asset-table>
    </div>


    <!-- Edit Modal -->
    <app-asset-edit-modal [isOpen]="modalState.showEditModal" [activeTab]="activeTab"
      [selectedAsset]="modalState.selectedAsset" [loading]="loading" [units]="units" [caseTypeList]="caseTypeList"
      [propellantList]="propellantList" [compatibilityList]="compatibilityList"
      [hazardDivisionList]="hazardDivisionList" [natureOptions]="natureOptions" [primaryPurposes]="primaryPurposes"
      [projectileColors]="projectileColors" [projectailMaterials]="projectailMaterials"
      [classifications]="classifications" [itemTypes]="itemTypes" [countries]="countries" [imageState]="imageState"
      (closed)="closeEditModal()" (saved)="onEditSaved($event)">
    </app-asset-edit-modal>

    <!-- Delete Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showDeleteModal" [title]="'assetList.deleteModal.title' | translate"
      [message]="('assetList.deleteModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.deleteModal.warning' | translate" confirmText="{{ 'common.delete' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="danger" (confirmed)="confirmDelete()"
      (cancelled)="closeDeleteModal()">
    </app-confirm-dialog>

    <!-- Permanent Delete Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showPermanentDeleteModal"
      [title]="'assetList.permanentDeleteModal.title' | translate"
      [message]="('assetList.permanentDeleteModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.permanentDeleteModal.warning' | translate"
      confirmText="{{ 'assetList.actions.permanentDelete' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="danger" (confirmed)="confirmPermanentDelete()"
      (cancelled)="closePermanentDeleteModal()">
    </app-confirm-dialog>

    <!-- Restore Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showRestoreModal"
      [title]="'assetList.restoreModal.title' | translate"
      [message]="('assetList.restoreModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.restoreModal.warning' | translate"
      confirmText="{{ 'assetList.actions.restore' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="primary" (confirmed)="confirmRestore()"
      (cancelled)="closeRestoreModal()">
    </app-confirm-dialog>
