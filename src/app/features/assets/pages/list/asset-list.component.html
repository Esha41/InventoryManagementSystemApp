<div class="page-wrapper">
  <div class="page-container space-y-6">
    <app-asset-list-header data-onboarding="asset-list-header"
      [activeTab]="activeTab"
      [ammunitionViewMode]="ammunitionViewMode"
      [explosivesViewMode]="explosivesViewMode"
      [weaponsViewMode]="weaponsViewMode"
      [isRTL]="isRTL"
      (tabChange)="switchTab($event)"
      (addClick)="navigateToAddAsset()"
      (exportClick)="exportToExcel()"
      (importClick)="onImportToolbarClick()"
      (templateClick)="downloadImportTemplateFromApi()">
    </app-asset-list-header>

    <app-import-dialog [isOpen]="showImportModal" [entityName]="facade.activeTab" (close)="closeImportModal()"
      (preview)="onImportPreview($event)" (import)="onImportDirect($event)"
      (downloadTemplate)="downloadImportTemplateFromApi()">
    </app-import-dialog>

    <app-import-preview-dialog *ngIf="showPreviewModal && previewData" [previewData]="previewData"
      [assetType]="facade.activeTab"
      (confirm)="onPreviewConfirmed($event)" (cancel)="onPreviewCancelled()">
    </app-import-preview-dialog>

    <!-- Filters Card -->
    <div class="mb-6">
      <app-asset-filter-bar data-onboarding="asset-list-filters" [activeTab]="activeTab" [filterState]="filterState" [isRTL]="isRTL"
      [filterOptions]="filterOptions"
      (filterChange)="onFilterChange()" (searchTriggered)="onFilterChange()" (searchCleared)="onSearchCleared()" (clearFilters)="clearFilters()">
      </app-asset-filter-bar>
    </div>

    <!-- Assets Table Card (heading + sub-tabs + table inside one card) -->
    <div class="mt-6">
      <app-asset-table [assets]="(facade.assets$ | async) ?? []" [activeTab]="activeTab" [loading]="(facade.loading$ | async) ?? false" [sortState]="sortState"
      [ammunitionViewMode]="ammunitionViewMode" [explosivesViewMode]="explosivesViewMode" [weaponsViewMode]="weaponsViewMode"
      [totalItems]="(facade.totalItems$ | async) ?? 0" [showEditDelete]="(activeTab !== 'ammunition' || ammunitionViewMode === 'available') && (activeTab !== 'explosive' || explosivesViewMode === 'available') && (activeTab !== 'weapon' || weaponsViewMode === 'available')"
      [showRestore]="(activeTab === 'ammunition' && ammunitionViewMode === 'deleted') || (activeTab === 'explosive' && explosivesViewMode === 'deleted') || (activeTab === 'weapon' && weaponsViewMode === 'deleted')"
      [showPermanentDelete]="(activeTab === 'ammunition' && ammunitionViewMode === 'deleted') || (activeTab === 'explosive' && explosivesViewMode === 'deleted') || (activeTab === 'weapon' && weaponsViewMode === 'deleted')"
      [paginationState]="paginationState" [totalPages]="totalPages" [getAssetName]="getAssetName"
      (view)="onView($event)" (edit)="onEdit($event)" (delete)="onDelete($event)" (restore)="onRestore($event)" (permanentDelete)="onPermanentDelete($event)" (sort)="sortByColumn($event)"
      (pageChange)="onPageChange($event)" (rowsPerPageChange)="onRowsPerPageChange($event)"
      (ammunitionViewModeChange)="switchAmmunitionViewMode($event)" (explosivesViewModeChange)="switchExplosivesViewMode($event)" (weaponsViewModeChange)="switchWeaponsViewMode($event)"
      (imageError)="onImageError($event)" (showImagePreview)="showImagePreview($event.event, $event.asset)"
      (hideImagePreview)="hideImagePreview()">
      </app-asset-table>
    </div>


    <!-- Edit Modal -->
    <app-asset-edit-modal [isOpen]="modalState.showEditModal" [activeTab]="activeTab"
      [selectedAsset]="modalState.selectedAsset" [loading]="loading" [units]="units" [caseTypeList]="caseTypeList"
      [propellantList]="propellantList" [compatibilityList]="compatibilityList"
      [hazardDivisionList]="hazardDivisionList" [natureOptions]="natureOptions" [primaryPurposes]="primaryPurposes"
      [projectileColors]="projectileColors" [projectailMaterials]="projectailMaterials"
      [classifications]="classifications" [itemTypes]="itemTypes" [countries]="countries" [imageState]="imageState"
      (closed)="closeEditModal()" (saved)="onEditSaved($event)">
    </app-asset-edit-modal>

    <!-- Delete Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showDeleteModal" [title]="'assetList.deleteModal.title' | translate"
      [message]="('assetList.deleteModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.deleteModal.warning' | translate" confirmText="{{ 'common.delete' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="danger" (confirmed)="confirmDelete()"
      (cancelled)="closeDeleteModal()">
    </app-confirm-dialog>

    <!-- Permanent Delete Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showPermanentDeleteModal"
      [title]="'assetList.permanentDeleteModal.title' | translate"
      [message]="('assetList.permanentDeleteModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.permanentDeleteModal.warning' | translate"
      confirmText="{{ 'assetList.actions.permanentDelete' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="danger" (confirmed)="confirmPermanentDelete()"
      (cancelled)="closePermanentDeleteModal()">
    </app-confirm-dialog>

    <!-- Restore Confirmation Modal -->
    <app-confirm-dialog [isOpen]="modalState.showRestoreModal"
      [title]="'assetList.restoreModal.title' | translate"
      [message]="('assetList.restoreModal.confirmMessage' | translate) + ' ' + (modalState.selectedAsset?.name || '') + '?'"
      [description]="'assetList.restoreModal.warning' | translate"
      confirmText="{{ 'assetList.actions.restore' | translate }}"
      cancelText="{{ 'common.cancel' | translate }}" confirmVariant="primary" (confirmed)="confirmRestore()"
      (cancelled)="closeRestoreModal()">
    </app-confirm-dialog>
