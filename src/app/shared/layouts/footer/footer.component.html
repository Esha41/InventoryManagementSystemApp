<footer class="bg-[var(--color-background)] border-t border-[var(--color-border)] pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] px-4 sm:px-6">
  <div class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-center text-sm text-[var(--color-text-muted)]">
    <p>
      {{ 'footer.copyright' | translate:{ year: currentYear } }}
      <span class="mx-2 text-[var(--color-border)]">|</span>
      <span class="font-mono text-xs opacity-75">{{ version }}</span>
    </p>
  </div>
</footer>
