<nav
  class="navbar-theme shadow-custom-md h-14 min-h-[3.5rem] md:h-16 flex items-center px-4 md:px-6 z-40 border-b border-[var(--color-navbar-border)]">
  <div class="flex items-center justify-between w-full min-w-0 gap-2">
    <!-- Left side - Logo -->
    <div class="flex items-center gap-2 md:gap-3 min-w-0 flex-shrink-0 ps-2 sm:ps-3 md:ps-4">
      <button (click)="onMenuClick()"
        class="md:hidden navbar-button-hover min-w-[2.75rem] min-h-[2.75rem] p-2 rounded-lg transition-colors duration-200 flex items-center justify-center -ms-1"
        aria-label="Toggle menu">
        <lucide-angular [img]="Menu" class="h-6 w-6 text-[var(--color-navbar-fg)]"></lucide-angular>
      </button>

      <img src="assets/EMDAD-EXT-VER-Digi-Logo-White_updated.png" alt="EMDAD Logo"
        class="h-14 md:h-16 max-w-[132px] md:max-w-[168px] navbar-logo object-contain object-left flex-shrink-0"
        style="direction: ltr;" />
    </div>

    <!-- Right side - Actions -->
    <div class="flex items-center gap-1 sm:gap-2 md:gap-4 flex-shrink-0">
      <!-- Theme Toggle - Visible on all screens, min 44px touch target -->
      <button data-onboarding="theme-toggle" (click)="toggleTheme()"
        class="flex navbar-button-hover min-w-[2.75rem] min-h-[2.75rem] p-2 rounded-lg transition-colors duration-200 items-center justify-center"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <lucide-angular [img]="isDarkMode ? Sun : Moon" class="h-5 w-5 text-[var(--color-navbar-fg)]"></lucide-angular>
      </button>

      <!-- Language Toggle -->
      <button data-onboarding="language-toggle" (click)="toggleLanguage()"
        class="flex items-center gap-2 min-w-[2.75rem] min-h-[2.75rem] p-2 md:px-3 md:py-2 rounded-lg hover:bg-white/20 transition-colors duration-200 justify-center"
        aria-label="Change language">
        <lucide-angular [img]="Globe" class="h-5 w-5 text-[var(--color-navbar-fg)]"></lucide-angular>
        <span class="hidden md:inline text-sm font-medium text-[var(--color-navbar-fg)]">{{ getCurrentLanguage() }}</span>
      </button>

      <!-- Notifications -->
      <button data-onboarding="notifications" (click)="navigateToNotifications()"
        class="relative min-w-[2.75rem] min-h-[2.75rem] p-2 rounded-lg hover:bg-white/20 transition-colors duration-200 flex items-center justify-center"
        aria-label="Notifications">
        <lucide-angular [img]="Bell" class="h-5 w-5 text-[var(--color-navbar-fg)]"></lucide-angular>
        <span *ngIf="notificationCount > 0"
          class="absolute top-1 h-5 w-5 bg-[var(--color-error)] rounded-full flex items-center justify-center"
          [class.right-1]="!isRTL" [class.left-1]="isRTL">
          <span class="text-[10px] md:text-xs font-bold text-white leading-none">{{ notificationCount }}</span>
        </span>
      </button>

      <!-- User Profile Dropdown -->
      <div class="relative" data-onboarding="user-profile">
        <button (click)="toggleUserMenu()"
          class="flex items-center gap-2 md:gap-3 min-w-[2.75rem] min-h-[2.75rem] p-2 md:px-3 md:py-2 rounded-lg hover:bg-white/20 transition-colors duration-200"
          aria-label="User profile"
          [attr.aria-expanded]="showUserMenu">
          <!-- User Avatar with Initials -->
          <div
            class="h-8 w-8 md:h-9 md:w-9 rounded-full bg-[var(--color-background)] flex items-center justify-center shadow-sm border border-[var(--color-border)]">
            <span class="text-xs md:text-sm font-bold text-[var(--color-brand)]">{{ getUserInitials() }}</span>
          </div>

          <!-- User Info (Hidden on mobile) -->
          <div class="hidden md:flex flex-col items-start">
            <span class="text-sm font-semibold text-[var(--color-navbar-fg)]">{{ getUserFullName() }}</span>
          </div>

          <!-- Chevron -->
          <lucide-angular [img]="ChevronDown"
            class="hidden md:block h-4 w-4 text-[var(--color-navbar-fg-muted)] transition-transform duration-200"
            [class.rotate-180]="showUserMenu"></lucide-angular>
        </button>

        <!-- Dropdown Menu - responsive width, doesn't overflow viewport -->
        <div *ngIf="showUserMenu"
          class="absolute mt-2 w-64 max-w-[calc(100vw-2rem)] bg-[var(--color-background)] rounded-xl shadow-custom-lg border border-[var(--color-border)] animate-in fade-in slide-in-from-top-2 duration-200 z-50"
          [class.right-0]="!isRTL" [class.left-0]="isRTL" (click)="$event.stopPropagation()">
          <!-- User Info in Dropdown -->
          <div class="px-4 py-3 border-b border-[var(--color-border)]">
            <div class="flex items-center gap-3">
              <div
                class="h-12 w-12 rounded-full bg-gradient-to-br from-[var(--color-accent)] to-[var(--color-accent-dark)] flex items-center justify-center shadow-sm">
                <span class="text-base font-bold text-white">{{ getUserInitials() }}</span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-[var(--color-text)] truncate">{{ getUserFullName() }}</p>
                <p class="text-xs text-[var(--color-text-muted)] truncate">{{ getUserEmail() }}</p>
              </div>
            </div>
          </div>

          <!-- Menu Items -->
          <div class="py-2">
            <button (click)="navigateToProfile()"
              class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-[var(--color-text)] hover:bg-[var(--color-background-hover)] transition-colors">
              <lucide-angular [img]="User" class="h-4 w-4 text-[var(--color-accent)]"></lucide-angular>
              <span class="font-medium flex-1 text-start">{{ 'profile.menu.myProfile' | translate }}</span>
              <span *ngIf="pendingDelegationCount > 0"
                class="rounded-full w-5 h-5 bg-red-500 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">
                {{ pendingDelegationCount }}
              </span>
            </button>
          </div>

          <!-- Logout -->
          <div class="py-2 border-t border-[var(--color-border)]">
            <button (click)="logout()"
              class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-[var(--color-error)] hover:bg-[var(--color-error)]/5 transition-colors">
              <lucide-angular [img]="LogOut" class="h-4 w-4"></lucide-angular>
              <span class="font-medium">{{ 'accessDenied.logout' | translate }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Overlay to close menu when clicking outside -->
<div *ngIf="showUserMenu" (click)="closeUserMenu()" class="fixed inset-0 z-30"></div>
