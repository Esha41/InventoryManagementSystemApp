<div class="min-h-screen bg-gradient-to-br from-[#F9FAFB] to-[#F3F4F8] flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
  <!-- Language Switcher Button - Fixed Top Right -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10">
    <button
      (click)="toggleLanguage()"
      class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white shadow-md hover:shadow-lg border border-[var(--color-border)] hover:border-[var(--color-brand)]/30 transition-all duration-200 group"
      aria-label="Change language"
    >
      <lucide-angular 
        [img]="Globe" 
        class="h-5 w-5 text-[var(--color-text-muted)] group-hover:text-[var(--color-brand)] transition-all duration-200"
        [style.transform]="isRTL ? 'scaleX(-1)' : 'none'"
      ></lucide-angular>
      <span class="text-sm font-semibold text-[var(--color-text)] group-hover:text-[var(--color-brand)] transition-colors duration-200">{{ getCurrentLanguage() }}</span>
    </button>
  </div>

  <div class="w-full max-w-[480px]">
    <!-- Logo and Header Section -->
    <div class="text-center mb-8">
      <div class="inline-block mb-6">
        <img 
          src="assets/logo.png" 
          alt="Barzan Holdings" 
          class="h-16 w-auto drop-shadow-sm"
          [class.scale-x-[-1]]="isRTL"
        />
      </div>
      <h1 class="text-3xl font-bold text-[var(--color-text)] mb-3 tracking-tight">
        Welcome Back
      </h1>
      <p class="text-base text-[var(--color-text-muted)] font-medium">
        Sign in to your account to continue
      </p>
    </div>

    <!-- Auth Content Card -->
    <div class="bg-white rounded-2xl shadow-custom-xl border border-[var(--color-border)] overflow-hidden">
      <div class="px-8 py-10 sm:px-10 sm:py-12">
        <router-outlet />
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8">
      <p class="text-sm text-[var(--color-text-light)] font-medium">
        © 2025 Barzan Holdings. All rights reserved.
      </p>
    </div>
  </div>
</div>
