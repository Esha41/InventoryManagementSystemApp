<div class="flex flex-col min-h-dvh h-dvh overflow-hidden bg-[var(--color-background-muted)]"
  [class.mobile-sidebar-open]="mobileSidebarOpen">
  <!-- Navbar - Full Width at Top -->
  <app-navbar (menuClick)="onMobileMenuToggle()"></app-navbar>

  <!-- Content Area with Sidebar -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar *ngIf="!shouldHideSidebar" [forceCollapsed]="shouldCollapseSidebar" (toggleSidebar)="onSidebarToggle($event)" [mobileOpen]="mobileSidebarOpen"
      (closeMobile)="mobileSidebarOpen = false"></app-sidebar>

    <!-- Main Content Area (banner + page content) -->
    <div class="flex flex-col flex-1 min-h-0 overflow-hidden min-w-0">
      <!-- Announcement Banners (beside sidebar, above page content) -->
      <app-announcement-banner></app-announcement-banner>

      <!-- Page Content -->
      <main data-onboarding="main-content" class="flex-1 min-h-0 overflow-y-auto">
        <router-outlet />
      </main>

      <!-- Footer -->
      <app-footer></app-footer>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<app-toast></app-toast>

<!-- Idle Timeout Warning -->
<app-idle-timeout-modal></app-idle-timeout-modal>

<!-- Terms acceptance (before onboarding tour) -->
<app-terms-acceptance-modal></app-terms-acceptance-modal>
