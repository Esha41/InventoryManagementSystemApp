<!-- Mobile Overlay - touch-none prevents scroll-through on iOS -->
<div *ngIf="mobileOpen"
  class="fixed inset-0 z-40 bg-black/50 md:hidden backdrop-blur-sm transition-opacity touch-none overscroll-contain"
  (click)="onCloseMobile()"
  aria-hidden="true"></div>

<aside data-onboarding="sidebar"
  class="bg-[var(--color-sidebar-bg)] shadow-custom-lg transition-all duration-300 ease-in-out flex flex-col h-full fixed inset-y-0 z-50 md:relative md:z-20 md:translate-x-0 w-[85vw] max-w-64 md:w-64 will-change-transform"
  [class.left-0]="!isRTL" [class.right-0]="isRTL" [class.translate-x-0]="mobileOpen"
  [class.-translate-x-full]="!mobileOpen && !isRTL" [class.translate-x-full]="!mobileOpen && isRTL"
  [class.md:w-64]="!isCollapsed" [class.md:w-20]="isCollapsed">
  <!-- Toggle Button Section - min-h for touch targets -->
  <div class="h-14 min-h-[3.5rem] md:h-16 flex items-center justify-end px-3 md:px-4 border-b border-[var(--color-sidebar-border)] shrink-0">
    <!-- Show Logo on Mobile Drawer -->
    <div class="md:hidden flex-1 flex items-center">
      <span class="font-bold text-xl text-[var(--color-text)] tracking-wider">EMDAD</span>
    </div>

    <button (click)="toggleCollapse()"
      class="hidden md:flex min-w-[2.75rem] min-h-[2.75rem] p-2 rounded-lg hover:bg-[var(--color-background-hover)] transition-colors duration-200 items-center justify-center"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <lucide-angular [img]="isCollapsed ? (isRTL ? ChevronLeft : ChevronRight) : (isRTL ? ChevronRight : ChevronLeft)"
        class="h-5 w-5 text-[var(--color-text-muted)]"></lucide-angular>
    </button>

    <!-- Close Button (Mobile Only) - min 44px touch target -->
    <button (click)="onCloseMobile()"
      class="md:hidden min-w-[2.75rem] min-h-[2.75rem] p-2 rounded-lg hover:bg-[var(--color-error)]/10 text-[var(--color-text-muted)] hover:text-[var(--color-error)] transition-colors flex items-center justify-center"
      aria-label="Close menu">
      <lucide-angular [img]="isRTL ? ChevronRight : ChevronLeft" class="h-5 w-5"></lucide-angular>
    </button>
  </div>

  <!-- Navigation Menu - smooth scroll on iOS with visible scrollbar for discoverability -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden py-4 overscroll-contain sidebar-nav-scroll">
    <ul class="space-y-1 px-3">
      <li *ngFor="let item of menuItems; let i = index">
        <!-- Separator before Reports section -->
        <div *ngIf="item.label === 'nav.reports'" class="my-2 border-t border-[var(--color-border)]"></div>

        <!-- Header/Section Label -->
        <div *ngIf="item.isHeader" class="px-3 py-2 mt-4 first:mt-0">
          <span
            class="text-xs font-semibold text-[var(--color-text-muted)] uppercase tracking-wider transition-opacity duration-300"
            [class.opacity-0]="isCollapsed" [class.opacity-100]="!isCollapsed" [class.hidden]="isCollapsed">
            {{ item.label | translate }}
          </span>
        </div>

        <!-- Menu Item with Children (Submenu) -->
        <app-sidebar-collapsed-flyout
          #flyout
          *ngIf="!item.isHeader && hasChildren(item)"
          class="mb-1"
          [collapsed]="isCollapsed"
          [menuItem]="item"
          [title]="item.label | translate"
          [submenuExpanded]="isSubmenuExpanded(item.label)"
          [attr.data-onboarding]="item.label === 'nav.requestManagement' ? 'request-management' : null">
          <button
            type="button"
            data-flyout-trigger
            (click)="onParentSubmenuClick($event, item.label)"
            class="w-full flex items-center px-3 py-2.5 rounded-lg transition-all duration-200 hover:bg-[var(--color-sidebar-active)] text-[var(--color-text-muted)]"
            [class.justify-center]="isCollapsed"
            [class.bg-[var(--color-sidebar-active)]]="isCollapsed && isSubmenuRouteActive(item)"
            [attr.aria-expanded]="isCollapsed ? flyout.isOpen : isSubmenuExpanded(item.label)"
            [attr.aria-haspopup]="isCollapsed ? 'menu' : null">
            <lucide-angular [img]="item.icon" class="h-5 w-5 flex-shrink-0"
              [class.mr-3]="!isRTL && !isCollapsed" [class.ml-3]="isRTL && !isCollapsed"></lucide-angular>
            <ng-container *ngIf="item.label === 'nav.requestManagement'; else regularParentLabel">
              <span class="font-medium flex-1 transition-opacity duration-300 leading-tight" [class.text-left]="!isRTL"
                [class.text-right]="isRTL" [class.opacity-0]="isCollapsed" [class.opacity-100]="!isCollapsed"
                [class.hidden]="isCollapsed">
                {{ (item.label | translate)?.split(' ')[0] }}<br />
                {{ (item.label | translate)?.split(' ')[1] }}
              </span>
            </ng-container>
            <ng-template #regularParentLabel>
              <span class="font-medium flex-1 transition-opacity duration-300" [class.text-left]="!isRTL"
                [class.text-right]="isRTL" [class.opacity-0]="isCollapsed" [class.opacity-100]="!isCollapsed"
                [class.hidden]="isCollapsed">
                {{ item.label | translate }}
              </span>
            </ng-template>
            <lucide-angular *ngIf="!isCollapsed" [img]="isRTL ? ChevronLeft : ChevronRight"
              class="h-4 w-4 flex-shrink-0 transition-transform duration-200 chevron-right"
              [class.rotate-90]="!isRTL && isSubmenuExpanded(item.label)"
              [class.-rotate-90]="isRTL && isSubmenuExpanded(item.label)"></lucide-angular>
          </button>
          <!-- Submenu Items -->
          <ul *ngIf="!isCollapsed && isSubmenuExpanded(item.label) && item.children" class="mt-1 space-y-1"
            [class.ml-8]="!isRTL" [class.mr-8]="isRTL">
            <li *ngFor="let child of item.children">
              <!-- Header within submenu -->
              <div *ngIf="child.isHeader" class="px-3 py-2 mt-2 first:mt-0">
                <span class="text-xs font-semibold text-[var(--color-text-muted)] uppercase tracking-wider">
                  {{ child.label | translate }}
                </span>
              </div>
              <!-- Nested submenu (child with children) -->
              <div *ngIf="!child.isHeader && hasChildren(child)" class="mb-1">
                <button (click)="toggleSubmenu(child.label)"
                  class="w-full flex items-center px-3 py-2 rounded-lg transition-all duration-200 hover:bg-[var(--color-sidebar-active)] text-[var(--color-text-muted)] text-sm">
                  <span class="font-medium flex-1" [class.text-left]="!isRTL" [class.text-right]="isRTL">{{ child.label
                    | translate }}</span>
                  <lucide-angular [img]="isRTL ? ChevronLeft : ChevronRight"
                    class="h-3 w-3 flex-shrink-0 transition-transform duration-200"
                    [class.rotate-90]="!isRTL && isSubmenuExpanded(child.label)"
                    [class.-rotate-90]="isRTL && isSubmenuExpanded(child.label)"></lucide-angular>
                </button>
                <!-- Nested submenu items -->
                <ul *ngIf="isSubmenuExpanded(child.label) && child.children" class="mt-1 space-y-1"
                  [class.ml-4]="!isRTL" [class.mr-4]="isRTL">
                  <li *ngFor="let nestedChild of child.children">
                    <a *ngIf="nestedChild.route" [routerLink]="nestedChild.route"
                      [class.bg-[var(--color-sidebar-hover)]]="isSubmenuLinkActive(nestedChild.route)"
                      [class.text-[var(--color-text)]]="isSubmenuLinkActive(nestedChild.route)"
                      class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-[var(--color-sidebar-active)] text-[var(--color-text-muted)] text-sm">
                      <span class="font-medium">{{ nestedChild.label | translate }}</span>
                    </a>
                  </li>
                </ul>
              </div>
              <!-- Regular submenu item (no nested children) -->
              <a *ngIf="!child.isHeader && !hasChildren(child) && child.route" [routerLink]="child.route"
                [class.bg-[var(--color-sidebar-hover)]]="isSubmenuLinkActive(child.route)"
                [class.text-[var(--color-text)]]="isSubmenuLinkActive(child.route)"
                class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-[var(--color-sidebar-active)] text-[var(--color-text-muted)] text-sm">
                <span class="font-medium">{{ child.label | translate }}</span>
              </a>
            </li>
          </ul>
        </app-sidebar-collapsed-flyout>

        <!-- Regular Menu Item (No Children) -->
        <div *ngIf="!item.isHeader && !hasChildren(item)" #menuItem
          appSidebarRailTooltip
          [sidebarRailCollapsed]="isCollapsed"
          [appSidebarRailTooltip]="item.label | translate">
          <a [routerLink]="item.route"
            [class.bg-[var(--color-background-hover)]]="isTopLevelMenuItemActive(item)"
            [class.text-[var(--color-text)]]="isTopLevelMenuItemActive(item)"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 hover:bg-[var(--color-sidebar-active)] text-[var(--color-text-muted)]">
            <lucide-angular [img]="item.icon" class="h-5 w-5 flex-shrink-0"></lucide-angular>
            <span class="font-medium flex-1 transition-opacity duration-300" [class.opacity-0]="isCollapsed"
              [class.opacity-100]="!isCollapsed" [class.hidden]="isCollapsed">
              {{ item.label | translate }}
            </span>
          </a>
        </div>

        <!-- Separator after Reports section -->
        <div *ngIf="item.label === 'nav.reports' && i < menuItems.length - 1 && menuItems[i + 1]?.label === 'nav.admin'"
          class="my-2 border-t border-[var(--color-border)]"></div>
      </li>
    </ul>
  </nav>
</aside>
