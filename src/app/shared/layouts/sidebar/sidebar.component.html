<aside
  class="bg-white shadow-custom-lg transition-all duration-300 ease-in-out flex flex-col h-full"
  [class.w-64]="!isCollapsed"
  [class.w-20]="isCollapsed"
>
  <!-- Toggle Button Section -->
  <div class="h-16 flex items-center justify-end px-4 border-b border-[var(--color-border)]">
    <button
      (click)="toggleCollapse()"
      class="p-2 rounded-lg hover:bg-[var(--color-background-hover)] transition-colors duration-200"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <lucide-angular
        [img]="isCollapsed ? ChevronRight : ChevronLeft"
        class="h-5 w-5 text-[var(--color-text-muted)]"
      ></lucide-angular>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="space-y-1 px-3">
      <li *ngFor="let item of menuItems">
        <!-- Header/Section Label -->
        <div *ngIf="item.isHeader" class="px-3 py-2 mt-4 first:mt-0">
          <span
            class="text-xs font-semibold text-[var(--color-text-muted)] uppercase tracking-wider transition-opacity duration-300"
            [class.opacity-0]="isCollapsed"
            [class.opacity-100]="!isCollapsed"
            [class.hidden]="isCollapsed"
          >
            {{ item.label | translate }}
          </span>
        </div>

        <!-- Menu Item with Children (Submenu) -->
        <div *ngIf="!item.isHeader && hasChildren(item)" class="mb-1 relative group" #menuItem (mouseenter)="showTooltip($event)" (mouseleave)="hideTooltip()">
          <button
            (click)="toggleSubmenu(item.label)"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 hover:bg-[var(--color-background-active)] text-[var(--color-text-muted)]"
          >
            <lucide-angular
              [img]="item.icon"
              class="h-5 w-5 flex-shrink-0"
            ></lucide-angular>
            <span
              class="font-medium flex-1 text-left transition-opacity duration-300"
              [class.opacity-0]="isCollapsed"
              [class.opacity-100]="!isCollapsed"
              [class.hidden]="isCollapsed"
            >
              {{ item.label | translate }}
            </span>
            <lucide-angular
              *ngIf="!isCollapsed"
              [img]="isSubmenuExpanded(item.label) ? ChevronUp : ChevronDown"
              class="h-4 w-4 flex-shrink-0 transition-transform duration-200"
            ></lucide-angular>
          </button>
          <!-- Tooltip for collapsed state -->
          <div *ngIf="isCollapsed" class="menu-tooltip">
            {{ item.label | translate }}
          </div>
          <!-- Submenu Items -->
          <ul
            *ngIf="!isCollapsed && isSubmenuExpanded(item.label) && item.children"
            class="ml-8 mt-1 space-y-1"
          >
            <li *ngFor="let child of item.children">
              <a
                [routerLink]="child.route"
                routerLinkActive="bg-[var(--color-background-hover)] text-[var(--color-text)]"
                [routerLinkActiveOptions]="{ exact: child.route === '/warehouse' }"
                class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-[var(--color-background-active)] text-[var(--color-text-muted)] text-sm"
              >
                <span class="font-medium">{{ child.label | translate }}</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Regular Menu Item (No Children) -->
        <div *ngIf="!item.isHeader && !hasChildren(item)" class="relative group" #menuItem (mouseenter)="showTooltip($event)" (mouseleave)="hideTooltip()">
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-[var(--color-background-hover)] text-[var(--color-text)]"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 hover:bg-[var(--color-background-active)] text-[var(--color-text-muted)]"
          >
          <lucide-angular
            [img]="item.icon"
            class="h-5 w-5 flex-shrink-0"
          ></lucide-angular>
          <span
            class="font-medium transition-opacity duration-300"
            [class.opacity-0]="isCollapsed"
            [class.opacity-100]="!isCollapsed"
            [class.hidden]="isCollapsed"
          >
            {{ item.label | translate }}
          </span>
          </a>
          <!-- Tooltip for collapsed state -->
          <div *ngIf="isCollapsed" class="menu-tooltip">
            {{ item.label | translate }}
          </div>
        </div>
      </li>
    </ul>
  </nav>
</aside>
