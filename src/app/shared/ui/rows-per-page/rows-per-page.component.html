<div class="flex flex-nowrap items-center gap-2">
  <span class="text-sm text-[var(--color-text)] whitespace-nowrap">{{ 'common.showing' | translate }} {{ displayCount }}</span>
  <app-dropdown
    class="w-16"
    [showSearch]="false"
    [(ngModel)]="rowsPerPage"
    (selectionChange)="onRowsPerPageChange($event)"
    [options]="options">
  </app-dropdown>
  <span class="text-sm text-[var(--color-text)] whitespace-nowrap">{{ 'common.of' | translate }} {{ totalItems }}</span>
</div>
