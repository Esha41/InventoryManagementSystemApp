<div class="rpp-root">
  <span class="rpp-label text-[var(--color-text)]">{{ 'common.showing' | translate }} {{ displayCount }}</span>
  <app-dropdown
    class="rpp-dropdown shrink-0"
    [showSearch]="false"
    [(ngModel)]="rowsPerPage"
    (selectionChange)="onRowsPerPageChange($event)"
    [options]="options">
  </app-dropdown>
  <span class="rpp-label text-[var(--color-text)]">{{ 'common.of' | translate }} {{ totalItems }}</span>
</div>
