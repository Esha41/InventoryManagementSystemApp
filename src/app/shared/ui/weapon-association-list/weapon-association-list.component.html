<ul
  class="space-y-1.5"
  [class.text-xs]="compact"
  [class.text-sm]="!compact"
  role="list">
  <li
    *ngFor="let association of associations ?? []"
    class="flex items-start gap-2 text-[var(--color-text)]"
    role="listitem">
    <span
      class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--color-brand)]"
      aria-hidden="true"></span>
    <div class="min-w-0 flex flex-wrap items-center gap-x-2 gap-y-0.5">
      <button
        *ngIf="linkable && isCatalogAssociation(association); else associationLabel"
        type="button"
        class="break-words text-start leading-snug text-[var(--color-brand)] underline-offset-2 transition-colors hover:text-[var(--color-brand-dark)] hover:underline focus:outline-none focus:ring-2 focus:ring-[var(--color-brand)] focus:ring-offset-1 rounded-sm"
        [attr.aria-label]="('common.viewDetails' | translate) + ': ' + getAssociationDisplay(association).title"
        (click)="onAssociationClick($event, association)">
        {{ getAssociationDisplay(association).title }}
      </button>
      <ng-template #associationLabel>
        <span class="break-words leading-snug">{{ getAssociationDisplay(association).title }}</span>
      </ng-template>
      <span
        *ngIf="getAssociationDisplay(association).isCustom"
        class="inline-flex shrink-0 items-center rounded-full border border-[var(--color-border)] bg-[var(--color-background-muted)] px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-[var(--color-text-muted)]">
        {{ customLabelKey | translate }}
      </span>
    </div>
  </li>
</ul>
