<!-- Unified Layout (Dashboard Style) -->
<div *ngIf="layout === 'unified'"
    class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 p-2 bg-[var(--color-background)] rounded-xl shadow-premium border border-[var(--color-border)]">

    <!-- Search Bar -->
    <div *ngIf="showSearchBar" class="relative flex items-center min-w-[400px] max-w-[500px] flex-1 group">
        <div
            class="absolute start-3.5 pointer-events-none transition-colors duration-200 group-focus-within:text-[var(--color-brand)]">
            <lucide-angular [img]="Search" class="w-4.5 h-4.5 text-[var(--color-text-muted)]"></lucide-angular>
        </div>
        <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange($event)"
            [placeholder]="searchPlaceholder | translate"
            class="dashboard-search-input w-full ps-11 pe-10 py-2.5 bg-[var(--color-background-muted)]/40 rounded-lg border-none text-sm text-[var(--color-text)] placeholder-[var(--color-text-muted)] transition-all">
        <button *ngIf="searchQuery" (click)="clearSearch()"
            class="absolute end-3 p-1 text-[var(--color-text-muted)] hover:text-[var(--color-error)] transition-colors">
            <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
        </button>
    </div>

    <div *ngIf="showSearchBar && (showStatusFilter || showPriorityFilter)"
        class="hidden sm:block h-8 w-px bg-[var(--color-border)]"></div>

    <!-- Filters Container -->
    <div class="flex items-center gap-4 pe-2">
        <!-- Filter Icon & Label -->
        <div *ngIf="showStatusFilter || showPriorityFilter"
            class="flex items-center gap-2 text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-wider ps-1">
            <lucide-angular [img]="Filter" class="w-4 h-4"></lucide-angular>
            <span class="hidden xl:inline">{{ 'dashboard.filters.filterByStatus' | translate }}</span>
        </div>

        <!-- Status Filter -->
        <app-dropdown *ngIf="showStatusFilter" class="w-44" [(ngModel)]="statusFilter"
            (ngModelChange)="onStatusChange($event)" [options]="statusFilterOptions"
            [optionLabelFn]="statusFilterLabelFn" optionValue="value" [placeholderSelectable]="false">
        </app-dropdown>

        <!-- Priority Filter -->
        <app-dropdown *ngIf="showPriorityFilter" class="w-44" [(ngModel)]="priorityFilter"
            (ngModelChange)="onPriorityChange($event)" [options]="priorityFilterOptions"
            [optionLabelFn]="priorityFilterLabelFn" optionValue="value" [placeholderSelectable]="false">
        </app-dropdown>

        <!-- Result Count Badge -->
        <div *ngIf="showResultCount"
            class="flex items-center justify-center min-w-[34px] h-8.5 px-3 bg-[var(--color-brand)] text-white rounded-lg text-sm font-bold shadow-soft"
            [title]="'dashboard.count' | translate">
            {{ resultCount }}
        </div>
    </div>
</div>

<!-- Separate Layout (Requests Management Style) -->
<div *ngIf="layout === 'separate'"
    class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full sm:w-auto sm:flex-shrink-0">

    <!-- Search Bar (wrapped in styled container like unified layout) -->
    <div *ngIf="showSearchBar"
        class="flex items-center p-2 bg-[var(--color-background)] rounded-xl shadow-premium border border-[var(--color-border)] flex-1 sm:flex-initial min-w-[250px] sm:max-w-[500px]">
        <div class="relative flex items-center flex-1 group">
            <div
                class="absolute start-3.5 pointer-events-none transition-colors duration-200 group-focus-within:text-[var(--color-brand)]">
                <lucide-angular [img]="Search" class="w-4.5 h-4.5 text-[var(--color-text-muted)]"></lucide-angular>
            </div>
            <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange($event)"
                [placeholder]="searchPlaceholder | translate"
                class="dashboard-search-input w-full ps-11 pe-10 py-2.5 bg-[var(--color-background-muted)]/40 rounded-lg border-none text-sm text-[var(--color-text)] placeholder-[var(--color-text-muted)] transition-all">
            <button *ngIf="searchQuery" (click)="clearSearch()"
                class="absolute end-3 p-1 text-[var(--color-text-muted)] hover:text-[var(--color-error)] transition-colors">
                <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
            </button>
        </div>
    </div>

    <!-- Status Filter -->
    <div *ngIf="showStatusFilter"
        class="flex items-center gap-3 px-4 py-2.5 bg-[var(--color-background)] rounded-lg shadow-custom-sm border border-[var(--color-border)] flex-shrink-0 relative">
        <div class="flex items-center gap-2 text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-wider">
            <lucide-angular [img]="Filter" class="w-4 h-4"></lucide-angular>
            <span class="hidden xl:inline">{{ 'dashboard.filters.filterByStatus' | translate }}</span>
        </div>
        <app-dropdown class="w-40 flex-shrink-0" [(ngModel)]="statusFilter" (ngModelChange)="onStatusChange($event)"
            [options]="statusFilterOptions" [optionLabelFn]="statusFilterLabelFn" optionValue="value"
            [placeholderSelectable]="false" placeholder="{{ 'dashboard.filters.filterByStatus' | translate }}">
        </app-dropdown>
        <div *ngIf="showResultCount"
            class="flex items-center justify-center min-w-[34px] h-8.5 px-3 bg-[var(--color-brand)] text-white rounded-lg text-sm font-bold shadow-soft"
            [title]="'dashboard.count' | translate">
            {{ resultCount }}
        </div>
    </div>

    <!-- Priority Filter -->
    <div *ngIf="showPriorityFilter"
        class="flex items-center gap-3 px-4 py-2.5 bg-[var(--color-background)] rounded-lg shadow-custom-sm border border-[var(--color-border)] flex-shrink-0 relative">
        <span class="text-sm font-medium text-[var(--color-text-muted)] whitespace-nowrap">{{
            'requestsManagement.filterByPriority' | translate }}:</span>
        <app-dropdown class="w-40 flex-shrink-0" [(ngModel)]="priorityFilter" (ngModelChange)="onPriorityChange($event)"
            [options]="priorityFilterOptions" [optionLabelFn]="priorityFilterLabelFn" optionValue="value"
            [placeholderSelectable]="false" placeholder="{{ 'requestsManagement.filterByPriority' | translate }}">
        </app-dropdown>
    </div>
</div>
