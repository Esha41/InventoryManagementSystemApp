<div class="app-dropdown" [class.app-dropdown-disabled]="disabled" [class.app-dropdown-error]="error">
  <button
    type="button"
    class="app-dropdown-trigger"
    [class.app-dropdown-open]="isOpen"
    [attr.disabled]="disabled ? true : null"
    (click)="toggleDropdown()"
    (blur)="onTriggerBlur()"
  >
    <span class="app-dropdown-label" [class.app-dropdown-placeholder]="!hasSelection">
      {{ displayLabel }}
    </span>
    <lucide-angular
      [img]="ChevronDown"
      class="app-dropdown-icon"
      [class.app-dropdown-icon-rotated]="isOpen"
    ></lucide-angular>
  </button>

  <div class="app-dropdown-panel" *ngIf="isOpen">
    <!-- Add Action (when addActionLabel is set, shown at top of panel) -->
    <div *ngIf="addActionLabel" class="app-dropdown-add-action border-b border-[var(--color-border)] p-2">
      <button type="button" (click)="onAddActionClick($event)"
        class="w-full flex items-center justify-center gap-2 px-3 py-2 text-sm font-medium text-[var(--color-brand)] hover:bg-[var(--color-brand)]/10 rounded-lg transition-colors">
        {{ addActionLabel | translate }}
      </button>
    </div>
    <!-- Search Input (hidden when showSearch=false, e.g. rows-per-page with few options) -->
    <div class="app-dropdown-search" *ngIf="showSearch && options && options.length > 0" (click)="onSearchClick($event)">
      <div class="relative flex items-center">
        <span
          class="pointer-events-none absolute inset-y-0 z-[1] flex w-10 items-center justify-center text-[var(--color-text-muted)]"
          [ngClass]="{'start-0': !isRTL, 'end-0': isRTL}"
          aria-hidden="true"
        >
          <lucide-angular [img]="Search" class="h-4 w-4 shrink-0"></lucide-angular>
        </span>
        <input
          type="text"
          class="app-dropdown-search-input"
          [value]="searchTerm"
          (input)="onSearchChange($event)"
          (click)="onSearchClick($event)"
          [placeholder]="'common.search' | translate"
          style="text-align: start;"
          [ngStyle]="isRTL
            ? { paddingInlineStart: '0.75rem', paddingInlineEnd: '2.5rem' }
            : { paddingInlineStart: '2.5rem', paddingInlineEnd: '0.75rem' }"
        />
      </div>
    </div>

    <ul class="app-dropdown-list" [ngClass]="panelClass">
      <li
        class="app-dropdown-option"
        *ngFor="let option of computedOptions; let idx = index; trackBy: trackOption"
        [class.app-dropdown-option-selected]="isSelected(option)"
        [class.app-dropdown-option-disabled]="isOptionDisabled(option)"
        (click)="selectOption(option)"
      >
        <span *ngIf="multiple" class="flex items-center gap-2 w-full">
          <input
            type="checkbox"
            [checked]="isSelected(option)"
            (click)="$event.stopPropagation()"
            (change)="selectOption(option)"
            class="h-4 w-4 rounded border-2 border-[var(--color-border)] text-[var(--color-brand)] focus:ring-2 focus:ring-[var(--color-brand)]/20 cursor-pointer"
            [disabled]="isOptionDisabled(option)"
          />
          <span class="flex-1">{{ getOptionLabel(option) }}</span>
        </span>
        <span *ngIf="!multiple">{{ getOptionLabel(option) }}</span>
      </li>
      <li class="app-dropdown-empty" *ngIf="computedOptions.length === 0">
        {{ searchTerm ? ('common.noResultsFound' | translate) : noDataText }}
      </li>
    </ul>
  </div>
</div>
