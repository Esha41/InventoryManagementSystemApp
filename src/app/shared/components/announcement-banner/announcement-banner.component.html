<div class="announcement-banners" *ngIf="announcements().length > 0">
    <div *ngFor="let announcement of announcements()"
        class="announcement-banner"
        [ngClass]="getBannerClass(announcement.priority)">
        <div class="flex-1 flex items-center gap-2 sm:gap-3 min-w-0">
            <lucide-angular [img]="Megaphone" class="h-4 w-4 sm:h-5 sm:w-5 flex-shrink-0 banner-icon"></lucide-angular>
            <p class="text-xs sm:text-sm font-semibold banner-text leading-snug">
                {{ announcement.message }}
            </p>
        </div>
        <button *ngIf="announcement.isDismissable" (click)="dismiss(announcement)"
            class="banner-dismiss banner-dismiss-btn transition-colors min-w-[2.75rem] min-h-[2.75rem] flex items-center justify-center" [attr.aria-label]="'announcements.dismiss' | translate">
            <lucide-angular [img]="X" class="h-5 w-5"></lucide-angular>
        </button>
    </div>
</div>
