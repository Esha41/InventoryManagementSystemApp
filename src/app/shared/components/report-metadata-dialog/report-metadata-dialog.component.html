<app-modal [isOpen]="isOpen" [title]="title" (closed)="close()" size="md">
  <form [formGroup]="metadataForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Report Name -->
    <div>
      <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
        {{ 'reportDesigner.metadataDialog.reportName' | translate }} 
        <span class="text-[var(--color-error)]">*</span>
      </label>
      <input 
        type="text" 
        formControlName="reportName" 
        [placeholder]="'reportDesigner.metadataDialog.reportNamePlaceholder' | translate"
        class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all"
        [class.border-[var(--color-error)]]="metadataForm.get('reportName')?.invalid && metadataForm.get('reportName')?.touched" 
      />
      <p *ngIf="getFieldError('reportName')" class="mt-2 text-sm text-[var(--color-error)]">
        {{ getFieldError('reportName') }}
      </p>
    </div>

    <!-- URL -->
    <div>
      <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
        {{ 'reportDesigner.metadataDialog.url' | translate }} 
        <span class="text-[var(--color-error)]">*</span>
      </label>
      <input 
        type="text" 
        formControlName="url" 
        [placeholder]="'reportDesigner.metadataDialog.urlPlaceholder' | translate"
        class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all font-mono text-sm"
        [class.border-[var(--color-error)]]="metadataForm.get('url')?.invalid && metadataForm.get('url')?.touched" 
      />
      <p *ngIf="getFieldError('url')" class="mt-2 text-sm text-[var(--color-error)]">
        {{ getFieldError('url') }}
      </p>
      <p class="mt-1 text-xs text-[var(--color-text-muted)]">
        {{ 'reportDesigner.metadataDialog.urlHint' | translate }}
      </p>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-semibold text-[var(--color-text)] mb-2">
        {{ 'reportDesigner.metadataDialog.description' | translate }}
      </label>
      <textarea 
        formControlName="description" 
        rows="4"
        [placeholder]="'reportDesigner.metadataDialog.descriptionPlaceholder' | translate"
        class="w-full px-4 py-2.5 border-2 border-[var(--color-border)] rounded-lg focus:outline-none focus:border-[var(--color-brand)] focus:ring-4 focus:ring-[var(--color-brand)]/20 transition-all resize-none"
        [class.border-[var(--color-error)]]="metadataForm.get('description')?.invalid && metadataForm.get('description')?.touched"
      ></textarea>
      <p *ngIf="getFieldError('description')" class="mt-2 text-sm text-[var(--color-error)]">
        {{ getFieldError('description') }}
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage"
      class="bg-[var(--color-error)]/10 border border-[var(--color-error)] text-[var(--color-error)] px-4 py-3 rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Actions -->
    <div modal-footer class="flex items-center justify-end gap-3">
      <app-button type="button" variant="secondary" (click)="close()" [disabled]="isLoading">
        {{ 'common.cancel' | translate }}
      </app-button>
      <app-button type="submit" variant="primary" [disabled]="isLoading || metadataForm.invalid">
        {{ isLoading ? ('common.saving' | translate) : ('common.save' | translate) }}
      </app-button>
    </div>
  </form>
</app-modal>
